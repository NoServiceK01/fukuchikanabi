<style>
:root{--bg:#f3f7fd;--panel:#fff;--band:#e4edf9;--ink:#14263d;--mute:#5b6f87;--car:#2f7fd0;--line:#b2c4da;--rule:#d6e2f1;--acc:#1d64c8;--accf:#fff;--lc:#2a78d6;--stn:#8593a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--panel:#142132;--band:#1a2b42;--ink:#e2ecf8;--mute:#8aa0ba;--car:#4f93e0;--line:#3a5272;--rule:#233750;--acc:#6cacf5;--accf:#06203f;--lc:#4f93e0;--stn:#9aa8b8}}
:root[data-theme="dark"]{--bg:#0c1522;--panel:#142132;--band:#1a2b42;--ink:#e2ecf8;--mute:#8aa0ba;--car:#4f93e0;--line:#3a5272;--rule:#233750;--acc:#6cacf5;--accf:#06203f;--lc:#4f93e0;--stn:#9aa8b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans JP","Zen Kaku Gothic New",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
#sb .row{flex-wrap:wrap}
button,select,.btn,input[type=time],input[type=email],input[type=password],input[type=text],input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
button:active,select:active{transform:scale(.97)}
select{padding-right:6px}
.ib{width:40px;padding:0}
.pri,.seg button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
.seg{display:inline-flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-radius:0;min-height:44px;padding:0 4px;background:var(--bg);border-right:1px solid var(--line);font-size:15px}
.seg button:last-child{border-right:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:6px;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.6ch}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
#drop{max-width:760px;margin:0 auto;padding:22px 14px}
#drop h2{margin:0 0 14px;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:0;min-height:92px;padding:12px 14px;text-align:left;font-size:17px;font-weight:700;line-height:1.3;border-radius:10px;background:var(--panel);border:1px solid var(--rule);border-left:6px solid var(--acc)}
.tile:hover{background:var(--band)}
main{padding:0 0 160px}
#mn .wrap{max-width:none;overflow-x:auto}
input[type=time]{font-size:20px;font-weight:700;width:7.8em;font-variant-numeric:tabular-nums;cursor:text}
.ic{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;font-size:12px;font-weight:700;line-height:20px;vertical-align:-3px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
#map{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
svg{flex:none}
.ib svg{width:20px;height:20px;display:block}
#shp button{flex-direction:column;gap:2px;padding:6px 4px;min-height:64px;white-space:nowrap}
#shp svg{width:26px;height:30px;display:block}
.nm{font-size:17px;font-weight:700;fill:var(--ink)}
.nm.sub{font-size:15px}
#info{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--band);border-top:1px solid var(--rule);padding:8px 14px;z-index:5}
#info .wrap{min-height:30px}
#note{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
#note:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mute)}
.ln{margin-bottom:4px}
.mute{color:var(--mute)}
.hide{display:none!important}
.sw{width:32px;height:32px;min-height:0;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
#lcs input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
#sb{overflow:auto;padding:4px 14px 16px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px;border-bottom:1px solid var(--rule);text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
th{font-weight:400;color:var(--mute);font-size:12px}
tr.past{opacity:.4}tr.now{background:var(--band);font-weight:700}tr.next{box-shadow:inset 3px 0 0 var(--lc)}
.hr{width:2.3em;font-weight:700;font-size:22px}
.m{display:inline-flex;flex-direction:column;align-items:center;margin:0 12px 10px 0;line-height:1.15}.m b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.m small{font-size:11px;color:var(--mute);white-space:nowrap}
h3{margin:14px 0 4px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}


:root{--hd:#16427f}

header{background:var(--hd);color:#fff;border-bottom:0}

header button,header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}

.un{display:inline-block;background:var(--hd);color:#fff;border-radius:99px;padding:0 8px;font-size:13px;font-weight:700}

.c{flex-direction:column;justify-content:center;gap:0;width:84px;min-height:40px;border:0;border-radius:5px;padding:2px 3px;line-height:1.2;font-variant-numeric:tabular-nums}
.c b{font-size:15px}.c small{font-size:9px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav button{flex-direction:column;gap:2px;border:0;border-radius:0;background:transparent;min-height:56px;padding:0 2px;font-size:11px;font-weight:700;color:var(--mute);position:relative;letter-spacing:0;white-space:nowrap}
#bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bnav button.on{color:var(--acc);font-weight:700}
#bnav button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
#dgwrap{display:flex;flex-direction:column;height:calc(100dvh - var(--hh,54px) - 152px);min-height:320px;border-top:1px solid var(--rule);user-select:none;-webkit-user-select:none}
#dgtop{display:flex;flex:none}

#dgthead{flex:1;overflow:hidden;border-bottom:1px solid var(--rule);background:var(--panel);position:relative;height:22px}

#dgmid{flex:1;display:flex;min-height:0}
#dgside{flex:none;width:112px;overflow:hidden;border-right:1px solid var(--rule);background:var(--panel);position:relative}

#dgscroll{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#dgsvg{display:block}
#dgwrap.nonum .dgnum{display:none}
.dgnum{font-size:9px;font-weight:700}
#dgnum.on,#dgfull.on{background:var(--acc);color:var(--accf);border-color:var(--acc)} /* ONのときは色がつく */
#dg:fullscreen{display:flex;flex-direction:column;background:var(--bg)}
#dg:fullscreen #dgwrap{flex:1;height:auto;min-height:0}
header .pri{background:#fff;color:var(--hd);border-color:#fff}
#sbody{padding:0 14px 100px}
.stt{width:100%;border-collapse:collapse}.stt tr[data-t]{cursor:pointer}.stt tr[data-t]:hover td{background:var(--band)}
.stt th{font-size:11px;color:var(--mute);text-align:left;font-weight:400;padding:4px 6px}
.stt td{padding:5px 6px;white-space:nowrap;vertical-align:top}.stt tr.hh td{border-top:2px solid var(--rule)}
.stt td b{font-size:19px;font-variant-numeric:tabular-nums}.stt small{display:block;font-size:10px;color:var(--mute)}
.gmpop{border-collapse:collapse;font-size:13px;margin-top:4px;width:100%}.gmpop th,.gmpop td{padding:2px 6px 2px 0;text-align:left;white-space:nowrap;font-weight:400}.gmpop th{color:var(--mute);font-size:11px}.gmpop td b{font-variant-numeric:tabular-nums}
.ab{display:inline-block;min-width:2.4em;padding:0 5px;height:20px;border-radius:5px;text-align:center;font-size:11px;font-weight:700;line-height:20px;vertical-align:-3px;margin-right:4px;white-space:nowrap}
.circ{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border:1.2px solid var(--acc);border-radius:50%;color:var(--acc);font-size:9px;font-weight:700;line-height:1}
.cg{display:inline-flex;align-items:center;gap:2px;margin-right:8px}.cg:last-child{margin-right:0}
.secs{font-size:11px;color:var(--mut)}
.secsub{font-size:10px;color:var(--mut);white-space:nowrap;margin-top:1px}
#dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px}
#dbar button{min-height:36px;min-width:36px;font-size:18px}#dbar #dtoday{font-size:14px}
#dinfo{flex-basis:100%;font-size:13px;color:var(--mute)}
#mdia{font-size:11px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#pop.hide{display:none}
.pc{background:var(--panel);color:var(--ink);border-radius:12px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.pc h3{margin:0;font-size:18px}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.fl input{font-size:16px}
.fmw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.pv{font-size:10px;color:var(--mute);text-decoration:line-through;line-height:1.1}
.rp{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--band);color:var(--acc)}
#ph{margin-top:10px}#popen{margin-top:2px}
.wn{display:inline-block;margin-left:4px;width:15px;height:15px;border-radius:50%;background:#e8a317;color:#fff;font-size:11px;font-weight:700;line-height:15px;text-align:center;vertical-align:1px}
.wnote{margin:0 0 8px;padding:6px 10px;border-left:4px solid #e8a317;background:var(--band);font-size:12px}
.gh td{padding:14px 0 4px}

.lb{width:196px}
.fi{object-fit:contain;flex:none}.fi.gh0{opacity:.4}
.fct{display:inline-flex;align-items:center;gap:4px}
.fc{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin-bottom:8px}
.tp{display:inline-block;min-width:3.2em;padding:4px 10px;border-radius:8px;font-size:18px;font-weight:700;text-align:center}

.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.atabs button{flex:none;padding:0 14px;min-height:44px;font-size:15px;font-weight:700}.atabs button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
/* クールな見た目と押しやすさ(在線位置の並びや大きさは変えない) */
.pri{font-weight:700;letter-spacing:.03em;box-shadow:0 2px 10px rgba(20,60,120,.22)}
.pri.on{box-shadow:0 0 0 2px var(--accf),0 2px 10px rgba(20,60,120,.3)}

<div id="info" class="hide"><div class="wrap"><div id="inf"></div><div id="note">時刻表に基づく計算上の位置です。実際の運行とは異なる場合があります。路線をタップすると、その地点の通過時刻表が見られます</div></div></div>
<script>
const $=s=>document.querySelector(s);
let LX=[170,330];const X=l=>LX[l]??LX[LX.length-1], Y=r=>60+r*176, BC=["#d98c00","#2f8fd0","#a14fb8"];
let M=null,T=0,live=true,selIds=new Set(),hidden=new Set(),hideTT=new Set(),cur=[],lastHtml='';

function parseOud(t){const root={},stack=[root];for(const l of t.split('\n')){const c=stack[stack.length-1];if(l==='.'){if(stack.length>1)stack.pop();continue}const q=l.indexOf('=');if(q<0){if(l.endsWith('.')){const o={};(c[l.slice(0,-1)]??=[]).push(o);stack.push(o)}continue}c[l.slice(0,q)]=l.slice(q+1)}return root}
const tm=s=>{if(!s)return null;s=s.trim();if(!/^\d{3,6}$/.test(s))return null;const L=s.length;if(L<=4)return +s.slice(0,L-2)*3600+ +s.slice(-2)*60;return +s.slice(0,L-4)*3600+ +s.slice(-4,-2)*60+ +s.slice(-2)};
const fmt=(t,s)=>{t=Math.floor(t)%86400;return String(t/3600|0).padStart(2,'0')+':'+String(t%3600/60|0).padStart(2,'0')+(s?':'+String(t%60).padStart(2,'0'):'')};
// OuDiaの色は BBGGRR 順
const col=c=>{c=(c||'00000000').slice(-6);if(!/^[0-9a-fA-F]{6}$/.test(c))c='000000';const h='#'+c.slice(4,6)+c.slice(2,4)+c.slice(0,2);return h==='#000000'?'var(--ink)':h};

function setup(root,name){
  secCache=new WeakMap(); // 秒換算のキャッシュを捨てる(路線・ダイヤが変わったため)
  if(!lineFile&&name)lineFile=name+'.oud2'; // 直接ファイルを読み込んだときも、投稿や前回の項目の保存が動くように
  const R=root.Rosen[0];
  const st=R.Eki.map((e,i)=>({name:e.Ekimei,major:e.Ekikibo==='Ekikibo_Syuyou',core:e.BrunchCoreEkiIndex!=null?+e.BrunchCoreEkiIndex:null,tracks:e.EkiTrack2Cont?.[0]?.EkiTrack2||[]}));
  // --- 駅の接続関係を作る ---
  // BrunchCoreEkiIndex を持つ駅は、指された駅と同じ駅(分岐駅)。駅リストの隣同士は基本的につながるが、
  // 分岐駅とその相手の間にある側の隣接だけは、実際の線路ではないので外す
  const n=st.length,par=st.map((_,i)=>i),find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const cut=new Set();
  st.forEach((e,i)=>{if(e.core==null||e.core<0||e.core>=n)return;const a=find(i),b=find(e.core);if(a<b)par[b]=a;else par[a]=b;cut.add(i<e.core?i+'_'+(i+1):(i-1)+'_'+i)});
  const cn=i=>find(i),adj=new Map();
  st.forEach((_,i)=>{if(cn(i)===i)adj.set(i,new Set())});
  const fwd=new Set();
  for(let i=0;i<n-1;i++){if(cut.has(i+'_'+(i+1)))continue;const u=cn(i),v=cn(i+1);if(u!==v){adj.get(u).add(v);adj.get(v).add(u);fwd.add(u+'>'+v)}}
  // fwd: 下り列車がu→vへ進む向き。本線は下り向きに一方通行で最も長くたどれる経路にする
  const dn=(u,x)=>fwd.has(u+'>'+x),pos=[],lanes=[],conn=[],node={};let rows=0,maxLane=1;
  const longest=(u,up,vis=new Set([u]))=>{let best=[];for(const x of adj.get(u)){if(node[x]||vis.has(x)||!(up?dn(x,u):dn(u,x)))continue;vis.add(x);const p=longest(x,up,vis);if(p.length>best.length)best=p}return [u,...best]};
  for(;;){
    let main=[];for(const u of adj.keys())if(!node[u]){const p=longest(u,false);if(p.length>main.length)main=p}
    if(!main.length)break;
    const comp=[],cs=[];lanes.length=0;
    main.forEach((u,i)=>{node[u]={lane:0,row:i};comp.push(u)});
    const todo=[...main];
    while(todo.length){const v=todo.shift(),pv=node[v];
      for(const w of adj.get(v)){if(node[w])continue;
        // 下り列車が分岐線から駅へ入ってくる(合流)なら分岐線は駅の上側、駅から出ていくなら下側に伸ばす
        const up=dn(w,v)&&!dn(v,w),P=longest(w,up),r0=pv.row,len=P.length,lo=up?r0-len:r0+1,hi=up?r0-1:r0+len;
        let lane=1;while(lane===pv.lane||(lanes[lane]&&lanes[lane].some(([x,y])=>!(hi<x||lo>y))))lane++;
        (lanes[lane]??=[]).push([lo,hi]);maxLane=Math.max(maxLane,lane);
        P.forEach((u,k)=>{node[u]={lane,row:up?r0-1-k:r0+1+k};comp.push(u);todo.push(u)});
        const c={from:pv,lane,top:lo,bot:hi,up,end:P[len-1]};conn.push(c);cs.push(c)}}
    const rs=comp.map(u=>node[u].row),mn=Math.min(...rs),mx=Math.max(...rs),sh=rows-mn;
    comp.forEach(u=>node[u].row+=sh);cs.forEach(c=>{c.top+=sh;c.bot+=sh});rows+=mx-mn+1;
  }
  st.forEach((_,i)=>{pos[i]={...node[cn(i)],copy:cn(i)!==i,id:cn(i)}});
    const types=(R.Ressyasyubetsu||[]).map(t=>({name:t.Syubetsumei,ini:[...(t.Ryakusyou||t.Syubetsumei||'?')][0],ab:t.Ryakusyou||[...(t.Syubetsumei||'?')][0],col:col(t.DiagramSenColor||t.JikokuhyouMojiColor)}));
  M={st,pos,conn,rows,maxLane,types,adj,cn,cut,dias:(R.Dia||[]).map(d=>({name:d.DiaName||'ダイヤ',d,trains:null})),name:name||R.Rosenmei||'',kiten:(()=>{const k=tm(R.KitenJikoku);return k>0?k:14400})()};
  // --- 駅名・停車種別の文字幅から各レーンの位置と全体の幅を決める(駅名と列車アイコンが重ならないように) ---
  // 本線(レーン0)の文字は線の左側、分岐レーンの文字は線の右側。列車アイコンは線から26pxの位置で、
  // 同じ駅に列車が重なって寄る場合は34pxさらに外側(合計で約78pxまで)に出る
  M.dias.forEach(d=>{if(!d.trains)d.trains=build(d);d.stops=stopMap(d)});
  loadCfg(); // 路線ごとの詳細設定(<路線名>.config.json)
  const wl=[];
  st.forEach((e,i)=>{const p=pos[i];if(p.copy)return;let nc=0;for(const d of M.dias)nc=Math.max(nc,(d.stops.get(pk(i))||new Set()).size);
    const fs=p.lane?15:17,nw=[...e.name].reduce((a,c)=>a+(c.charCodeAt(0)>255?1:.58)*fs,0);wl[p.lane]=Math.max(wl[p.lane]||0,nw,nc*19)});
  LX=[12+(wl[0]||0)+6+96];LX[1]=LX[0]+190;
  for(let l=2;l<=maxLane;l++)LX[l]=LX[l-1]+96+(wl[l-1]||0)+8+96;
  const W=Math.ceil(Math.max(480,LX[Math.max(1,maxLane)]+82+(wl[Math.max(1,maxLane)]||0)+12));
  // 路線図(静的部分)
  let h='';
  for(let r=0;r<rows;r++)h+=`<rect x="0" y="${Y(r)-26}" width="${W}" height="52" fill="var(--band)"/>`;
  // 本線(レーン0)の線
  const l0=Object.values(node).filter(p=>p.lane===0).map(p=>p.row);
  if(l0.length){const ms=st.map((_,i)=>i).filter(i=>!pos[i].copy&&pos[i].lane===0).sort((a,b)=>pos[a].row-pos[b].row);
    if(!M.cfg||!M.cfg.segments.length||ms.length<2)h+=`<line x1="${X(0)}" y1="${Y(Math.min(...l0))-40}" x2="${X(0)}" y2="${Y(Math.max(...l0))}" stroke="var(--lc)" stroke-width="9" stroke-linecap="round"/>`;

function build(d){
  const n=M.st.length,out=[];
  for(const [sec,dir] of [['Kudari',0],['Nobori',1]])for(const r of (d.d[sec]?.[0]?.Ressya||[])){
    const route=[];
    (r.EkiJikoku||'').split(',').forEach((e,j)=>{
      if(!e)return;const m=e.match(/^(\d)(?:;([^$]*))?/);if(!m)return;const ty=+m[1];if(ty!==1&&ty!==2)return;
      // 上り列車の時刻は駅順が逆(末尾が最初の駅)で記録されている
      const s=dir?n-1-j:j;let a=null,dd=null;
      if(m[2]!=null){const p=m[2].split('/');a=tm(p[0]);dd=tm(p[1]);if(a==null)a=dd;if(dd==null)dd=a}
      route.push({s,a,d:dd,ps:ty===2,tk:(e.match(/\$(\d+)/)||[])[1]});
    });
    const si=[];route.forEach((x,i)=>{if(x.a!=null)si.push(i)});
    const stp=si.filter(i=>!route[i].ps);if(stp.length<2)continue;
    let off=route[si[0]].a<M.kiten?86400:0,prev=-1; // 起点時刻より前の時刻は翌日(24時以降)として扱う
    for(const i of si){const x=route[i];let a=x.a+off;if(a<prev){off+=86400;a+=86400}let dd=x.d+off;if(dd<a){off+=86400;dd+=86400}x.a=a;x.d=dd;prev=dd}
    out.push({dir,ty:+r.Syubetsu||0,name:[r.Ressyabangou,r.Ressyamei].filter(Boolean).join(' '),route,si,fs:stp[0],ls:stp[stp.length-1],t0:route[si[0]].a,t1:route[si[si.length-1]].d,id:out.length,bikou:r.Bikou||'',opk:Object.fromEntries(Object.entries(r).filter(([k])=>/^Operation\d+[AB]$/.test(k)))});
  }
  linkOps(out);return out;
}

// 最小費用の割り当て(ハンガリー法)。C は正方行列で、行iに割り当てる列を配列で返す
function assign(C){
  const N=C.length,u=new Float64Array(N+1),v=new Float64Array(N+1),p=new Int32Array(N+1),way=new Int32Array(N+1);
  for(let i=1;i<=N;i++){p[0]=i;let j0=0;const minv=new Float64Array(N+1).fill(Infinity),used=new Uint8Array(N+1);
    do{used[j0]=1;const i0=p[j0];let d=Infinity,j1=0;
      for(let j=1;j<=N;j++)if(!used[j]){const c=C[i0-1][j-1]-u[i0]-v[j];if(c<minv[j]){minv[j]=c;way[j]=j0}if(minv[j]<d){d=minv[j];j1=j}}
      for(let j=0;j<=N;j++){if(used[j]){u[p[j]]+=d;v[j]-=d}else minv[j]-=d}
      j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const r=new Int32Array(N);for(let j=1;j<=N;j++)r[p[j]-1]=j-1;return r}
// 運用の連なり。OperationNB=始発側 / OperationNA=終着側。値は「,」区切りで
//   5/…                      前後の列車と接続
//   3/時刻$連携コード/運用名    出区(始発側)・入区(終着側)。同じ連携コードの入区と出区は、車庫を経由してつながる
//   0/種類$開始/終了$番線       駅作業(入換など)。作業のあと、車両は指定の番線に移る
// つなぎ方: ①連携コードの一致 ②同じ駅ごとの最適な割り当て(駅作業の時刻と番線も考慮)
function linkOps(out){
  const K=M.kiten,sh=v=>v!=null&&v<K?v+86400:v; // 起点時刻より前は翌日
  const pv=v=>{const o={conn:false,depot:null,works:[]};
    for(const it of v.split(',')){
      if(it.startsWith('5/'))o.conn=true;
      else if(it.startsWith('3/')){const m=it.match(/^3\/([^$]*)\$([^/]*)(?:\/(.*))?$/);if(m)o.depot={t:sh(tm(m[1])),code:m[2],name:m[3]||''}}
      else if(it.startsWith('0/')){const m=it.match(/^0\/(\d*)\$([^/]*)\/([^$]*)\$(\d*)$/);if(m)o.works.push({s:sh(tm(m[2])),e:sh(tm(m[3])),tk:m[4]||null})}}
    return o};
  let any=false;
  for(const t of out){t.A={conn:false,depot:null,works:[]};t.B={conn:false,depot:null,works:[]};t.op=null;t.pv=t.nx=null;
    for(const k in t.opk){any=true;t[k.slice(-1)]=pv(t.opk[k])}
    const a=t.route[t.fs],b=t.route[t.ls];t.dep=a.d;t.arr=b.a;t.tkS=a.tk;
    const w=t.A.works.filter(x=>x.tk!=null);t.tkEff=w.length?w[w.length-1].tk:b.tk;              // 駅作業のあとの番線
    t.workEnd=Math.max(t.arr,...t.A.works.map(x=>x.e??0));
    t.workStart=t.B.works.length?Math.min(...t.B.works.map(x=>x.s??Infinity)):Infinity}
  out.ops=[];if(!any)return;
  // ① 入出区連携コード
  const As=new Map(),Bs=new Map(),add=(m,c,t)=>{if(!m.has(c))m.set(c,[]);m.get(c).push(t)};
  for(const t of out){if(t.A.depot&&t.A.depot.code)add(As,t.A.depot.code,t);if(t.B.depot&&t.B.depot.code)add(Bs,t.B.depot.code,t)}
  for(const [c,al] of As){const bl=(Bs.get(c)||[]).sort((p,q)=>p.dep-q.dep),used=new Set();
    for(const a of al.sort((p,q)=>p.arr-q.arr)){const b=bl.find(x=>!used.has(x)&&x.dep>=a.arr);if(b){used.add(b);a.nx=b;b.pv=a}}}
  // ② 同じ駅ごとに、到着列車と出発列車の組み合わせ全体が最適になるように割り当てる
  //    (時刻が合う・駅作業が終わっている・同じ番線(駅作業のあとの番線)を優先し、待ち時間が短いほど良い)
  const arr=new Map(),dep=new Map();
  for(const t of out){if(t.A.conn&&!t.nx)add(arr,t.route[t.ls].s,t);if(t.B.conn&&!t.pv)add(dep,t.route[t.fs].s,t)}
  for(const [s,A] of arr){const D=dep.get(s);if(!D)continue;
    const n=A.length,m=D.length,N=n+m,INF=1e9,C=Array.from({length:N},()=>new Array(N).fill(0));
    for(let a=0;a<n;a++){const x=A[a];
      for(let b=0;b<m;b++){const y=D[b],ok=x.workEnd<=y.dep&&!(y.B.works.length&&y.workStart<x.arr);
        C[a][b]=!ok?INF:((y.B.works.length||x.tkEff===y.tkS)?0:5000)+Math.min((y.dep-x.arr)/60,1000)}
      for(let b=0;b<n;b++)C[a][m+b]=a===b?20000:INF}               // 相手が見つからない到着列車
    for(let a=0;a<m;a++)for(let b=0;b<m;b++)C[n+a][b]=a===b?20000:INF;  // 相手が見つからない出発列車
    const as=assign(C);
    for(let a=0;a<n;a++){const b=as[a];if(b<m&&C[a][b]<INF){A[a].nx=D[b];D[b].pv=A[a]}}}
  // 連なりを運用にまとめる(運用名は最初の列車の出区に書かれた名前)。つながりが不完全なものには警告をつける
  let un=0;
  for(const t of out){if(t.pv)continue;const tr=[t];while(tr[tr.length-1].nx)tr.push(tr[tr.length-1].nx);
    const f=tr[0],l=tr[tr.length-1],nm=f.B.depot&&f.B.depot.name||'',warn=[];
    if(f.B.conn)warn.push('最初の列車に、前の列車が見つかりません');else if(f.B.depot&&f.B.depot.code)warn.push(`連携コード${f.B.depot.code}の入区が見つかりません`);else if(!f.B.depot)warn.push('出区の記述がありません');
    if(l.A.conn)warn.push('最後の列車が次の列車に接続のままです(つながる列車が見つかりません)');else if(l.A.depot&&l.A.depot.code)warn.push(`連携コード${l.A.depot.code}の出区が見つかりません`);else if(!l.A.depot)warn.push('入区の記述がありません');
    out.ops.push({name:nm||'運用'+(++un),named:!!nm,trains:tr,warn})}
  out.ops.sort((a,b)=>(a.named?0:1)-(b.named?0:1)||a.name.localeCompare(b.name,'ja',{numeric:true}));
  const cnt=new Map();for(const o of out.ops)cnt.set(o.name,(cnt.get(o.name)||0)+1);
  const kk=new Map();
  for(const o of out.ops){const f=o.trains[0];o.key=cnt.get(o.name)>1?`${o.name}(${M.st[f.route[f.fs].s].name})`:o.name;kk.set(o.key,(kk.get(o.key)||0)+1)}
  for(const o of out.ops)if(kk.get(o.key)>1){const f=o.trains[0],h=f.dep;o.key=`${o.key.slice(0,-1)} ${String(Math.floor(h/3600)%24).padStart(2,'0')}:${String(Math.floor(h%3600/60)).padStart(2,'0')})`} // 運用名の重複(同じ運用名・同じ始発駅)は時刻も付けて区別
  out.ops.forEach((o,i)=>{o.i=i;o.trains.forEach((t,k)=>{t.op=o;t.oi=k})});
}

const P=s=>{const p=M.pos[s];return{x:X(p.lane),y:Y(p.row)}};

const pp=P;
const poly=nodes=>nodes.map(z=>pp(z.s));

// 駅間を4分割し、区間ごとに段階的に進む。出発直後と到着直前は、その駅に別の番線の列車がいる場合だけ番線側へ寄る
function where(tr,t){
  const tMin=Math.floor(t/60)*60; // 筑肥線内は分単位(秒では更新しない)
  const sec=secFit(tr);
  const eff=x=>{ // 駅の着・発時刻(秒)。地下鉄の駅は秒換算、筑肥の駅はファイルの値
    if(x.ps||x.s>19||!sec)return{a:x.a,d:x.d};
    const sc=sec.times.get(pk(x.s));if(!sc)return{a:x.a,d:x.d};
    return{a:sc.a!=null?sc.a:x.a,d:sc.d!=null?sc.d:x.d};
  };

  {const b=tr.route[tr.ls];if(b.s<=19&&sec){const sc=sec.times.get(pk(b.s));if(sc&&sc.a!=null)t1=sc.a}}
  if(t<tr.t0){ // 前の列車と駅でつながっているなら、前の列車が終着に着いてから出発まで、始発駅で次の列車として待機する(入出庫の連携は車庫に入るので表示しない)

      const nx=R[si[k+1]];return{p:pp(x.s),from:x.s,next:nx?nx.s:x.s,k,q:1,sp:null}}

    try{t=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){t=new TextDecoder('shift_jis').decode(u)}

    catch(e){alert('このファイルは読み込めませんでした。OuDiaSecond形式(.oud2)のファイルを選んでください。')}};
  rd.readAsArrayBuffer(f);

// ---- ダイヤグラム(時刻×駅・番線の折れ線図)。OuDia のダイヤグラムと同じ見た目 ----

function dgGaps(){ // 区間 i (駅 i と i+1 の間) の幅(px、dgKy=1 のとき)。区間ごとの最短走行時間に比例(10px/分)、12〜40pxに収める

  for(const tr of cur){
    const R=tr.route,times=R.map(x=>x.d!=null?x.d:x.a);

    while(i<times.length){
      if(times[i]!=null){i++;continue}
      let j=i;while(j<times.length&&times[j]==null)j++;

      if(tA!=null&&tB!=null)for(let k=i;k<j;k++)times[k]=tA+(tB-tA)*(k-i+1)/(j-i+1);

function dgGapList(){

function dgY(r){ // 駅 r (小数も可) の y。区間の幅の累積に、縦の倍率をかける

function dgRows(){ // 駅ごとに1行(番線は出さない)。rowOf[駅] → 行番号

function dgTrainPts(tr,rowOf){ // 列車の折れ線の点。点=[時刻(秒),y,駅番号]。停車は着・発の2点、通過は前後の時刻で内挿

function dgSyncHeads(){ // 時刻の見出し・駅の見出しを、ダイヤのスクロールに合わせる(拡大は再描画で反映するので、ここでは移動だけ)

const dgPtrs=new Map();let dgPinch0=null,dgDown=null; // ピンチ(2本指)とタップの区別
$('#dgscroll').addEventListener('pointerdown',e=>{
  dgPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  else dgDown=null;

// 日本の祝日(2007〜2099年)。振替休日と国民の休日を含む
const jpHol=(()=>{
  const dow=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();
  const nthMon=(y,m,n)=>{const f=dow(y,m,1);return 1+(8-f)%7+(n-1)*7};          // m月の第n月曜日
  const eq=(y,k)=>Math.floor(k+0.242194*(y-1980)-Math.floor((y-1980)/4));        // 春分・秋分(1980〜2099年)
  const base=(y,m,d)=>{ // 振替休日を除く祝日か
    if(y<2007||y>2099)return false;
    if(m===1)return d===1||d===nthMon(y,1,2);
    if(m===2)return d===11||(d===23&&y>=2020);
    if(m===3)return d===eq(y,20.8431);
    if(m===4)return d===29;
    if(m===5)return d===3||d===4||d===5||(y===2019&&d===1);
    if(m===7){if(y===2020)return d===23||d===24;if(y===2021)return d===22||d===23;return d===nthMon(y,7,3)}
    if(m===8){if(y===2020)return d===10;if(y===2021)return d===8;return y>=2016&&d===11}
    if(m===9)return d===nthMon(y,9,3)||d===eq(y,23.2488);
    if(m===10){if(y===2019&&d===22)return true;return y!==2020&&y!==2021&&d===nthMon(y,10,2)}
    if(m===11)return d===3||d===23;
    if(m===12)return d===23&&y<=2018;
    return false};
  const add=(y,m,d,n)=>{const t=new Date(Date.UTC(y,m-1,d+n));return[t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()]};
  return(y,m,d)=>{
    if(base(y,m,d))return true;
    if(dow(y,m,d)!==0){ // 振替休日: 直前の連続する祝日の先頭が日曜なら、その次の平日
      for(let k=1;k<=7;k++){const[a,b,c]=add(y,m,d,-k);if(!base(a,b,c))break;if(dow(a,b,c)===0)return true}
      // 国民の休日: 前日と翌日がどちらも祝日の平日
      const p=add(y,m,d,-1),n=add(y,m,d,1);if(base(...p)&&base(...n))return true}
    return false};
})();
const ymd=s=>s.split('-').map(Number),dow=s=>{const [y,m,d]=ymd(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()};
const dayType=s=>{const [y,m,d]=ymd(s);return jpHol(y,m,d)||dow(s)===0?'h':dow(s)===6?'s':'w'}; // w=平日 s=土曜 h=休日(日曜・祝日)
const dayName=s=>{const t=dayType(s);return t==='h'?(dow(s)===0?'休日(日曜)':'休日(祝日)'):t==='s'?'土曜':'平日'};
const DRE={w:/平日/,s:/土曜|土休|土日|土・休|^土/,h:/休日|日曜|日祝|祝日|土休|土日|土・休/};
function diaFor(t){for(const k of {w:'whs',s:'shw',h:'hsw'}[t]){const i=M.dias.findIndex(d=>DRE[k].test(d.name));if(i>=0)return{i,exact:k===t}}return{i:0,exact:false}}
let selDate=svcDate(),view='roster';
function applyDate(){ // 選んだ日付の種類(平日・土曜・休日)に合うダイヤへ切り替える
  const r=M.free?{i:+$('#ddia').value||0,exact:true}:diaFor(dayType(selDate));
  if(r.i!==M.cur)useDia(r.i);
  const nm=M.dias[M.cur].name;
  $('#dinfo').textContent=M.free?selDate:dayName(selDate)+'  '+nm+(r.exact?'':'(該当するダイヤがないため代わりに表示)');
  $('#mdia').textContent=dayName(selDate)+'  '+nm;
}
const shiftDate=n=>{const [y,m,d]=ymd(selDate);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
function setDate(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;selDate=v;$('#dsel').value=$('#mdate').value=v;
  if(view==='map'){live=false;applyDate();posts=[];postsSig='';lastHtml=null;draw();loadPosts().then(refresh);saveLast();return} // 在線位置: 選んだ日付で静止表示
  showView(view==='tt'?'tt':view==='dg'?'dg':'roster');                    // 運用の番号が変わるので、運用の一覧などは開き直す
  posts=[];postsSig='';loadPosts().then(refresh);
}
$('#dsel').onchange=e=>setDate(e.target.value);$('#mdate').onchange=e=>setDate(e.target.value);
function nowSvc(){const j=new Date(Date.now()+9*3600e3),sec=j.getUTCHours()*3600+j.getUTCMinutes()*60+j.getUTCSeconds();return{T:sec<kitenS()?sec+86400:sec}} // 日本時間。起点時刻までは前日の続き
function goLive(){ // 今日・現在時刻に合わせて、実時間で動かす
  const d=svcDate(),ch=d!==selDate;selDate=d;live=true;$('#dsel').value=$('#mdate').value=d;applyDate();
  const t=Math.floor(nowSvc().T/5)*5;liveT5=t;T=(t>=M.lo&&t<=M.hi)?t:M.lo; // 5秒までで表示する
  if(ch){posts=[];postsSig=''}lastHtml=null;draw();loadPosts().then(refresh);saveLast()}
$('#dprev').onclick=()=>setDate(shiftDate(-1));$('#dnext').onclick=()=>setDate(shiftDate(1));$('#dtoday').onclick=()=>setDate(svcDate());

function saveLast(){ // いま開いている項目を覚える(再読み込みで同じところを開くため。管理者画面は覚えない)
  if(!M||!lineFile||view==='adm')return;
  try{localStorage.setItem('fkLast',JSON.stringify({file:lineFile,view,date:selDate,tt:ttMode,st:stI,stDir,ptEdge,ptFrac,ptDir,op:curOp,opHi}))}catch(e){}}
function readLast(){try{const s=JSON.parse(localStorage.getItem('fkLast')||'null');return s&&s.file?s:null}catch(e){return null}}
function applyLast(st){ // 前回開いていた項目を開く(路線の読み込みが終わったあとに呼ぶ)
  if(!st||!M)return;
  const v=st.view||'roster';
  if(v!=='map'&&st.date&&/^\d{4}-\d{2}-\d{2}$/.test(st.date)&&st.date!==selDate){selDate=st.date;$('#dsel').value=$('#mdate').value=st.date;applyDate()}
  if(v==='tt'&&st.tt==='pt'){
    if(['all','0','1'].includes(st.ptDir))ptDir=st.ptDir;
    if(st.ptEdge&&edgeList().some(e=>e.key===st.ptEdge)){ptEdge=st.ptEdge;ptFrac=typeof st.ptFrac==='number'?st.ptFrac:0.5}
    showView('tt','pt');
  }else if(v==='tt'){if(typeof st.st==='number'&&st.st>=0&&st.st<M.st.length)stI=st.st;if(typeof st.stDir==='number')stDir=st.stDir;showView('tt','st')}
  else if(v==='op'&&(cur.ops||[])[st.op]){opHi=typeof st.opHi==='number'?st.opHi:null;showView('op',st.op);scrollOpHi()}
  else if(v==='map')showView('map');
  else if(v==='dg')showView('dg');
  else if(v==='fv')showView('fv');

function blobUrl(d){ // data URI を短い blob URL にして、同じ長い文字列を HTML に何度も入れない

const numOf=x=>{const m=String(x==null?'':x).match(/\d+/);return m?+m[0]:Infinity};

const stInRange=(t,from,to)=>{ // t: 運行秒(起点4時からの通算)。from/to: 時刻入力の分(0-1439)またはnull。運行秒で比べるので、23:00〜でも0時超えの列車が入る
  if(from==null&&to==null)return true;
  const K=M.kiten/60,sm=Math.floor(t/60); // 運行分の起点(4時=240分)。0時台は24時台として扱う

  if(fs!=null&&ts!=null&&fs>ts)return sm>=fs||sm<=ts; // 運行日の境(4時)をまたぐ範囲

function stdRun(a,b){ // 地下鉄の2駅のあいだの走行時分(秒)。隣り合わない駅(快速の通過駅など)は経路をたどって合計する

function secFitCalc(tr,anchor){

function havM(a,b){ // 2点間の距離(m)
  const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=p2-p1,dl=(b.lon-a.lon)*Math.PI/180;

function geoProjOnLine(c,pts,cum){ // 点 c を折れ線(pts, 各頂点までの距離 cum)上に射影する。{線からの距離d, 始点からの距離along, 区間の番号k, 区間内の割合frac, 射影点の緯度経度}

  const done=new Set();

    const u=M.cn(i);if(done.has(u))continue;done.add(u);

function geoSnap(lat,lon){ // 地図上の点を、路線の一番近い場所に吸着させる。路線から300mより離れていたら null

  const L=best.line,sts=[];

    const u=M.cn(si);if(sts.length&&sts[sts.length-1].u===u)continue;sts.push({u,cum:L.cum[k]})}

  let i=-1;
  for(let k=0;k<sts.length-1;k++)if(best.along>=sts[k].cum-1e-9&&best.along<=sts[k+1].cum+1e-9){i=k;break}

function geoKmFor(edge){ // 地図から測った駅間の距離(km)と、その出どころ。駅の位置を一番近い線に射影して、線に沿った距離を測る。線路に沿った形が取れていれば、その距離。なければ直線距離

// 地図のタイルは OpenStreetMap のものだけを使う。Esri や OpenTopoMap のような

// 本当の原因は Referer だった: OSM のタイルサーバーは 2026年から Referer ヘッダー必須で、
// このファイルが <meta name="referrer" content="no-referrer"> を指定していたため、
// タイル要求に Referer が付かず 403 / ブロックタイルになっていた。いまは
// <meta name="referrer" content="strict-origin-when-cross-origin"> にして、
// タイルにも referrerPolicy を明示している(送るのはオリジンだけで、URL全体は送らない)。
// 1つ目が5回以上読み込めなかったら、次の OSM 系の配信元に切り替える。全部だめなら
// onFb(null) を呼び、変な地図には行かず「再試行する」で OSM から読み込み直す。

  {name:'OpenStreetMap（ドイツ版）',url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png',attr:'© OpenStreetMap contributors',maxZoom:19},
  {name:'OpenStreetMap（HOT版）',url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',attr:'© OpenStreetMap contributors, Tiles style by Humanitarian OpenStreetMap Team',maxZoom:19,subdomains:'abc'}];
function gmTileLayer(onFb){
  let idx=0,err=0;
  const p=GM_TILES[0];
  const tl=L.tileLayer(p.url,{maxZoom:p.maxZoom,attribution:p.attr,subdomains:p.subdomains||'abc',referrerPolicy:'strict-origin-when-cross-origin'});
  const setProv=n=>{if(tl.options)tl.options.attribution=n.attr;tl.setUrl(n.url)};
  tl.gmReset=()=>{idx=0;err=0;setProv(GM_TILES[0])};

async function gmTryTrack(){ // OpenStreetMap(Overpass)から線路の形を取りに行く。管理者が線を引いているときは、その線を使うので取りに行かない。取れなければ直線のまま
  if(GEO.mode==='track'||GEO.mode==='custom'||!gmTrackEligible())return;
  try{

    try{const c=localStorage.getItem(key);if(c&&gmApplyTrack(JSON.parse(c)))return}catch(e){}
    const q='[out:json][timeout:25];(relation["route"="subway"]["name"~"空港線|箱崎線"](33.4,129.9,33.7,130.5);relation["route"="train"]["name"~"筑肥線"](33.4,129.9,33.7,130.5););out geom;';

function gmApplyTrack(j){ // Overpassの結果から、線路に沿った折れ線を作る。おかしな形なら false(直線のまま)
  try{
    const rels=(j.elements||[]).filter(e=>e.type==='relation');
    if(!rels.length)return false;
    const raw=[];
    for(const rel of rels){
      let pts=[];
      for(const m of rel.members||[]){
        if(m.type!=='way'||!Array.isArray(m.geometry)||m.geometry.length<2)continue;
        let g=m.geometry.map(p=>({lat:p.lat,lon:p.lon,si:-1}));
        if(pts.length){
          const last=pts[pts.length-1];
          if(havM(last,g[g.length-1])<havM(last,g[0]))g.reverse();
          if(havM(last,g[0])>200)continue; // つながっていないwayは飛ばす
          if(havM(last,g[0])<1)g.shift();
        }
        pts=pts.concat(g);
      }
      if(pts.length>=3)raw.push(pts);
    }
    if(!raw.length)return false;
    const lines=[];
    for(let pts of raw){
      const stIdx=[];
      for(let i=0;i<M.st.length;i++){
        const c=geoCoord(i);if(!c)continue;
        let best=-1,bd=1e9;
        for(let k=0;k<pts.length;k++){const d=havM(c,pts[k]);if(d<bd){bd=d;best=k}}
        if(bd<=150)stIdx.push({k:best,si:i});
      }
      stIdx.sort((a,b)=>a.k-b.k||a.si-b.si);
      // 同じ点に複数の駅番号があるとき(分岐で重複する中洲川端など)は、前の駅の番号に一番近いものを残す
      const ded=[];
      for(let j=0;j<stIdx.length;j++){
        const grp=[stIdx[j]];
        while(j+1<stIdx.length&&stIdx[j+1].k===stIdx[j].k)grp.push(stIdx[++j]);
        const prev=ded.length?ded[ded.length-1].si:null;
        let pick=grp[0];
        if(prev!=null)for(const g of grp)if(Math.abs(g.si-prev)<Math.abs(pick.si-prev))pick=g;
        ded.push(pick);
      }
      if(ded.length<2)continue;
      const cum=geoCum(pts);
      ded.forEach(s=>s.along=cum[s.k]);
      const asc=ded.every((s,k)=>k===0||s.si>ded[k-1].si);
      const desc=ded.every((s,k)=>k===0||s.si<ded[k-1].si);
      if(!asc&&!desc)continue;
      if(desc){
        pts=pts.slice().reverse();
        const nc=geoCum(pts);
        ded.forEach(s=>{s.k=pts.length-1-s.k;s.along=nc[s.k]});
        ded.reverse();
      }
      for(const s of ded)pts[s.k].si=s.si;
      lines.push(pts);
    }
    if(!lines.length)return false;
    const onLine=new Set();
    for(const pts of lines)for(const p of pts)if(p.si!=null&&p.si>=0)onLine.add(M.cn(p.si));
    const need=new Set(M.st.map((s,i)=>M.cn(i)));
    if(![...need].every(u=>onLine.has(u)))return false;
    const chord=geoLineFromStations().reduce((t,L)=>t+geoCum(L).slice(-1)[0],0);
    const track=lines.reduce((t,pts)=>t+geoCum(pts).slice(-1)[0],0);
    if(!(track>chord*0.8&&track<chord*1.35))return false;
    geoSetLines(lines,'track');
    if(gmMap){gmDraw();const m=$('#gmdist');if(m&&gmPick)m.textContent=geoModeText('track')}
    return true;
  }catch(e){return false}}

function jsonLoose(t){ // コメントと末尾のカンマを取り除いて、ふつうの JSON にする

    if(c==='/'&&t[i+1]==='*'){const e=t.indexOf('*/',i+2);i=e<0?n:e+2;continue}
    if(c==='"')q=true;
    if(c===',')pend=o.length;
    else if(!/\s/.test(c)){if(pend>=0&&(c==='}'||c===']'))o=o.slice(0,pend)+o.slice(pend+1);pend=-1}

    if(a.i<0||b.i<0){W.push(`${lb}: 駅「${a.i<0?g.from:g.to}」が見つかりません`);return}
    if(!HEX.test(g.color||'')){W.push(`${lb}: color は #RRGGBB の形で指定してください`);return}
    for(const x of[a,b])if(x.n>1&&!/#/.test(String(x===a?g.from:g.to)))W.push(`${lb}: 「${x.name}」は同じ名前の駅が${x.n}つあります。最初の駅を使います(2番目は ${x.name}#2)`);
    const path=stPath(a.i,b.i);if(!path){W.push(`${lb}: 「${g.from}」と「${g.to}」は線路でつながっていません`);return}
    cfg.segments.push({name:String(g.name||''),color:g.color,nodes:new Set(path),edges:new Set(path.slice(1).map((v,k)=>ekey(path[k],v)))})});
  arr(j,'distances').slice(0,200).forEach((g,n)=>{const lb=`distances[${n+1}]`;
    if(!g||typeof g!=='object'){W.push(`${lb}: { } の形にしてください`);return}
    const a=stFinds(g.from),b=stFinds(g.to),km=+g.km;
    if(a.i<0||b.i<0){W.push(`${lb}: 駅「${a.i<0?g.from:g.to}」が見つかりません`);return}
    if(!isFinite(km)||km<=0||km>200){W.push(`${lb}: km は 0 より大きい数字で書いてください`);return}
    const u=M.cn(a.i),v=M.cn(b.i);if(u===v){W.push(`${lb}: 同じ駅どうしの距離は使えません`);return}
    cfg.distances.push({from:String(g.from),to:String(g.to),km:Math.round(km*10)/10});
    cfg.distKm.set(ekey(u,v),Math.round(km*10)/10)}); // あとに書いたものが優先
  const latlon=p=>Array.isArray(p)&&p.length>=2&&isFinite(+p[0])&&isFinite(+p[1])&&+p[0]>=-90&&+p[0]<=90&&+p[1]>=-180&&+p[1]<=180?[+p[0],+p[1]]:null;
  if(j.track!=null){ // 管理者が地図で引いた線路の形。線ごとに [緯度, 経度] の並び。null の線は直線のまま
    if(!Array.isArray(j.track))W.push('track は [ ] の形にしてください');
    else{const chord=geoLineFromStations();
      j.track.slice(0,20).forEach((L,li)=>{
        if(L==null){cfg.trackLines[li]=null;return}
        if(!Array.isArray(L)){W.push(`track[${li+1}] は [ ] の形にしてください`);cfg.trackLines[li]=null;return}
        const pts=L.map(latlon).filter(Boolean);
        if(pts.length<2){W.push(`track[${li+1}] は2点以上で書いてください`);cfg.trackLines[li]=null;return}
        const cl=chord[li]; // 向きを、駅の並びに合わせる
        if(cl&&cl.length>=2){
          const a=geoCoord(cl[0].si),b=geoCoord(cl[cl.length-1].si);
          if(a&&b){const d0=havM({lat:pts[0][0],lon:pts[0][1]},a)+havM({lat:pts[pts.length-1][0],lon:pts[pts.length-1][1]},b);
            const d1=havM({lat:pts[0][0],lon:pts[0][1]},b)+havM({lat:pts[pts.length-1][0],lon:pts[pts.length-1][1]},a);
            if(d1<d0)pts.reverse()}}
        cfg.trackLines[li]=pts})}}
  if(j.stationCoords!=null){ // 駅の位置の修正(駅名: [緯度, 経度])
    if(typeof j.stationCoords!=='object'||Array.isArray(j.stationCoords))W.push('stationCoords は { } の形にしてください');
    else for(const [k,v] of Object.entries(j.stationCoords)){
      const p=latlon(v);if(!p){W.push(`stationCoords「${k}」は [緯度, 経度] の形にしてください`);continue}
      if(!M.st.some(s=>s.name===k)){W.push(`stationCoords「${k}」という駅が見つかりません`);continue}

  if(j.types!=null&&(typeof j.types!=='object'||Array.isArray(j.types)))W.push('types は { } の形にしてください');
  else for(const [k,v] of Object.entries(j.types||{})){const ids=tyFinds(k);

    if(!v||typeof v!=='object'){W.push(`types「${k}」は { } の形にしてください`);continue}
    const o={};if('map' in v)o.map=!!v.map;if('timetable' in v)o.timetable=!!v.timetable;
    if(v.color!=null){if(HEX.test(v.color))o.color=v.color;else W.push(`types「${k}」: color は #RRGGBB の形で指定してください`)}
    if(v.ab!=null){if(typeof v.ab==='string'&&v.ab.trim()&&v.ab.length<=4)o.ab=v.ab.trim();else W.push(`types「${k}」: ab は4文字までの文字にしてください`)}
    for(const i of ids)cfg.types[i]={...(cfg.types[i]||{}),...o}}
  parseGroups(arr(j,'groups'),cfg.common,'groups');
  parseOps(arr(j,'operations'),cfg.common,'operations');
  parseOrder(j.order,cfg.common);
  if(j.dias!=null){ // ダイヤごとの運用設定。知らないダイヤ名でも、設定は残しておく(ダイヤ名が変わっただけかもしれないので)
    if(typeof j.dias!=='object'||Array.isArray(j.dias))W.push('dias は { } の形にしてください');
    else for(const [dn,dv] of Object.entries(j.dias)){
      if(typeof dn!=='string'||!dn.trim()||dn.length>60){W.push(`dias: ダイヤ名「${dn}」が正しくありません`);continue}
      if(!dv||typeof dv!=='object'||Array.isArray(dv)){W.push(`dias「${dn}」は { } の形にしてください`);continue}
      if(!M.dias.some(d=>d.name===dn))W.push(`dias「${dn}」: この路線に「${dn}」というダイヤはありません(ダイヤ名が変わったのかもしれません。設定は残してあります)`);
      const b=cfg.dias[dn]=bucket();
      parseGroups(arr(dv,'groups'),b,`dias「${dn}」.groups`);
      parseOps(arr(dv,'operations'),b,`dias「${dn}」.operations`);
      parseOrder(dv.order,b)}}
  res.cfg=cfg;res.raw=j;return res}

function findTrain(ref,byNo,byDep,W,opName,dn){ // 列車番号、または「始発駅 発時刻」。時刻は 24 時以降(25:10 など)も書ける
  const s=ref.trim(),m=s.match(/^(.+?)\s+(\d{1,2}):(\d{2})(?::\d{2})?$/);let c;
  if(m){let sec=+m[2]*3600+ +m[3]*60;if(sec<M.kiten)sec+=86400;const mi=Math.floor(sec/60);
    c=byDep.get(m[1]+'|'+mi)||(byNo.get(m[1])||[]).filter(t=>Math.floor(t.dep/60)===mi)}
  else c=byNo.get(s)||[];
  if(c.length>1)W.add(`operations「${opName}」: 「${ref}」に当てはまる列車が${c.length}本あります。最初の1本を使います(時刻を付けて「列車番号 5:30」のように指定できます)`);
  return c[0]||null}
function detach(t){const o=t.op;if(o){const k=o.trains.indexOf(t);if(k>=0)o.trains.splice(k,1)}
  if(t.pv&&t.pv.nx===t)t.pv.nx=null;if(t.nx&&t.nx.pv===t)t.nx.pv=null;t.pv=t.nx=null;t.op=null}
function applyCfgOps(){ // 自作の運用を作り、すべての運用をグループに分ける(ダイヤごと)
  const cfg=M.cfg,W=new Set(M.cfgInfo.warns),made=new Set();
  const stn=t=>M.st[t.route[t.fs].s].name,hm=s=>`${Math.floor(s/3600)%24}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
  for(const d of M.dias){const out=d.trains;if(!out)continue;if(!out.ops)out.ops=[];
    const db=cfg.dias[d.name]||{operations:[],groups:[],order:[]};
    const ops=[...cfg.common.operations.map((co,ci)=>({co,scope:'共通',ci})),...(db.operations||[]).map((co,ci)=>({co,scope:d.name,ci}))]; // 共通の運用と、このダイヤだけの運用
    const groups=[...(db.groups||[]),...cfg.common.groups]; // このダイヤのグループを優先
    const order=db.order&&db.order.length?db.order:cfg.common.order;
    d.groupsEff=groups; // このダイヤで使うグループ(運用一覧の表示用)
    const byNo=new Map(),byDep=new Map(),add=(m,k,t)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(t)};
    for(const t of out){if(t.name)add(byNo,t.name,t);add(byDep,stn(t)+'|'+Math.floor(t.dep/60),t)}
    const mine=[];
    ops.forEach(({co,scope,ci})=>{if(co.dia&&co.dia!==d.name)return;
      const trs=[],miss=[];for(const ref of co.trains){const t=findTrain(ref,byNo,byDep,W,co.name);t?trs.push(t):miss.push(ref)}
      made.add(scope+':'+ci);
      if(!trs.length){mine.push({name:co.name,named:true,trains:[],warn:[],custom:true,group:co.group,emptyOk:true});return} // 列車が入っていない運用も作る(あとから列車を追加できる)
      for(const ref of miss)W.add(`operations「${co.name}」(${d.name}): 列車「${ref}」が見つかりません`);
      const u=[...new Set(trs)].sort((a,b)=>a.dep-b.dep);for(const t of u){detach(t);for(const m of mine){const k=m.trains.indexOf(t);if(k>=0)m.trains.splice(k,1)}} // 同じダイヤの、前に作った自作の運用からも外す(あとの運用が優先)
      const warn=[];
      for(let k=0;k<u.length-1;k++){const a=u[k],b=u[k+1];
        if(a.route[a.ls].s===b.route[b.fs].s&&a.arr<=b.dep){a.nx=b;b.pv=a}
        else warn.push(a.route[a.ls].s!==b.route[b.fs].s?`「${a.name||stn(a)+' '+hm(a.dep)}」の終着駅と「${b.name||stn(b)+' '+hm(b.dep)}」の始発駅が違います`:`「${a.name||stn(a)+' '+hm(a.dep)}」の到着より前に「${b.name||stn(b)+' '+hm(b.dep)}」が出発します`)}
      mine.push({name:co.name,named:true,trains:u,warn,custom:true,group:co.group})});
    out.ops=out.ops.filter(o=>o.trains.length);
    const used=new Set(out.ops.map(o=>o.key));
    for(const o of mine){let k=o.name,n=2;if(used.has(k))k=o.name+'(自作)';while(used.has(k))k=`${o.name}(自作${n++})`;used.add(k);o.key=k;out.ops.push(o)}
    out.ops=out.ops.filter(o=>o.trains.length||o.emptyOk); // あとの自作の運用に列車を取られた運用は、空になるので外す(はじめから列車なしの運用は残す)
    out.ops.sort((a,b)=>(a.named?0:1)-(b.named?0:1)||a.name.localeCompare(b.name,'ja',{numeric:true}));
    if(order.length){const ix=new Map(order.map((k,i)=>[k,i]));out.ops.sort((a,b)=>(ix.has(a.key)?ix.get(a.key):1e9)-(ix.has(b.key)?ix.get(b.key):1e9))} // 管理者画面で決めた並び順(ないものは名前順のまま後ろ)
    for(const o of out.ops){if(!(o.custom&&o.group)){const g=groups.find(g=>g.ops.has(o.key)||g.ops.has(o.name)||(g.re&&(g.re.test(o.key)||g.re.test(o.name))));o.group=g?g.name:''}}
    out.ops.forEach((o,i)=>{o.i=i;o.trains.forEach((t,k)=>{t.op=o;t.oi=k})})}
  const unmade=(list,scope)=>list.forEach((co,ci)=>{if(!made.has(scope+':'+ci))W.add(`operations「${co.name}」(${scope}): ${co.dia?`ダイヤ「${co.dia}」に`:'このダイヤに'}列車が見つからないため、作りませんでした`)});
  unmade(cfg.common.operations,'共通');
  for(const [dn,b] of Object.entries(cfg.dias))unmade(b.operations,dn);
  M.cfgInfo.warns=[...W]}

function admClean(draft){ // 保存する形に整える。列車の入っていない自作の運用も残す(あとから列車を追加できる)

  d.segments=d.segments.filter(g=>g.from&&g.to);

  if(d.track){d.track=d.track.map(L=>Array.isArray(L)&&L.length>=2?L:null);if(!d.track.some(x=>x))delete d.track}
  if(d.stationCoords&&!Object.keys(d.stationCoords).length)delete d.stationCoords;
  d.groups=d.groups.filter(g=>g.name);
  d.groups.forEach(g=>{if(!g.match)delete g.match});d.segments.forEach(g=>{if(!g.name)delete g.name});
  const cleanOps=(list,scope)=>list.filter(o=>!!o.name);
  d.operations=cleanOps(d.operations,'共通');
  d.operations.forEach(o=>{if(!o.group)delete o.group});
  if(!d.order.length)delete d.order;
  const dias={};for(const [dn,b] of Object.entries(d.dias||{})){
    const ops=cleanOps(b.operations,dn);ops.forEach(o=>{if(!o.group)delete o.group});
    const grps=(b.groups||[]).filter(g=>g.name);grps.forEach(g=>{if(!g.match)delete g.match});
    const ord=(b.order||[]).filter(x=>typeof x==='string');
    if(ops.length||grps.length||ord.length)dias[dn]={operations:ops,groups:grps,order:ord}};
  if(Object.keys(dias).length)d.dias=dias;else delete d.dias;
  return{data:d,dropped}}

  if(ok){if(urlErr){alert(urlErr);urlErr=''}setTimeout(()=>{showList();loadAdmin();loadProfile()},0)}
  else{for(const el of ['#drop',...VIEWS])show(el,false);
    M=null;cur=[];posts=[];lineFile='';FM=new Map();isAdmin=false;adm=null;lineList=null;NAMES.clear();nameDraft=null;notices=[];closeMenu();sh=null;selIds=new Set();lastHtml='';for(const el of ['#base','#stp','#trains','#lines'])$(el).textContent='';}
}
async function api(q){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('auth');
  const r=await fetch(SB_URL+'/functions/v1/timetable?'+q,{headers:{Authorization:'Bearer '+session.access_token,apikey:SB_KEY}});
  if(r.status===401||r.status===403){await sb.auth.signOut();throw new Error('auth')}
  if(!r.ok){let d='';try{d=(await r.json()).error||''}catch(e){}throw new Error('HTTP '+r.status+(d?' '+d:''))}
  return r;
}
async function showList(cache){
  for(const el of VIEWS)show(el,false);show('#drop',true);
  const box=$('#lines'),msg=$('#lmsg');box.textContent='';
  try{if(!(cache&&lineList)){msg.textContent='読み込み中…';lineList=(await(await api('action=list')).json()).files}
    msg.textContent=lineList.length?'':'路線がまだ登録されていません';
    for(const n of lineList){const b=document.createElement('button');b.className='tile';b.textContent=n.replace(/\.oud2?$/i,'');b.onclick=()=>openLine(n);box.append(b)}
    if(!M){const st=readLast();if(st&&lineList.includes(st.file)){restorePending=st;openLine(st.file)}} // 前回開いていた路線があれば、路線選択を出さずにそのまま開く
  }catch(e){if(e.message!=='auth')msg.textContent='一覧を取得できませんでした('+e.message+')'}
}
async function openLine(n){
  $('#lmsg').textContent='読み込み中…';
  try{const b=await(await api('action=file&name='+encodeURIComponent(n))).blob();
    pendingCfg={text:null,err:'',src:''}; // 路線の詳細設定: 管理者画面の保存内容があればそれを、なければ設定ファイル(あれば)
    const [ls]=await Promise.all([sb.from('line_settings').select('config').eq('file',n).maybeSingle(),loadFormations(n)]);
    if(ls&&ls.data&&ls.data.config){pendingCfg.text=JSON.stringify(ls.data.config);pendingCfg.src='db'}
    else{pendingCfg.src='file';try{pendingCfg.text=await(await api('action=config&name='+encodeURIComponent(n))).text()}catch(e){if(e.message==='auth')throw e;pendingCfg.err=e.message}}
    $('#lmsg').textContent='';lineFile=n;lastFile=new File([b],n);loadFile(lastFile)}
  catch(e){if(e.message!=='auth')$('#lmsg').textContent='読み込めませんでした('+e.message+')'}
}
sb.auth.onAuthStateChange((_e,s)=>gate(s));
</script>

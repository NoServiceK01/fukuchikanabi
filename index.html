<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<title>運用・列車位置</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f7fd;--panel:#fff;--band:#e4edf9;--ink:#14263d;--mute:#5b6f87;--car:#2f7fd0;--line:#b2c4da;--rule:#d6e2f1;--acc:#1d64c8;--accf:#fff;--lc:#2a78d6;--stn:#8593a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--panel:#142132;--band:#1a2b42;--ink:#e2ecf8;--mute:#8aa0ba;--car:#4f93e0;--line:#3a5272;--rule:#233750;--acc:#6cacf5;--accf:#06203f;--lc:#4f93e0;--stn:#9aa8b8}}
:root[data-theme="dark"]{--bg:#0c1522;--panel:#142132;--band:#1a2b42;--ink:#e2ecf8;--mute:#8aa0ba;--car:#4f93e0;--line:#3a5272;--rule:#233750;--acc:#6cacf5;--accf:#06203f;--lc:#4f93e0;--stn:#9aa8b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 14px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
#sb .row{flex-wrap:wrap}
button,select,.btn,input[type=time],input[type=email],input[type=password],input[type=text],input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
select{padding-right:6px}
.ib{width:40px;padding:0}
.pri,.seg button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
.seg{display:inline-flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-radius:0;min-height:38px;padding:0 4px;background:var(--bg);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:6px;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:5.6ch}
input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
#drop{max-width:760px;margin:0 auto;padding:22px 14px}
#drop h2{margin:0 0 14px;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:0;min-height:92px;padding:12px 14px;text-align:left;font-size:17px;font-weight:700;line-height:1.3;border-radius:10px;background:var(--panel);border:1px solid var(--rule);border-left:6px solid var(--acc)}
.tile:hover{background:var(--band)}
main{padding:0 0 160px}
#mn .wrap{max-width:none;overflow-x:auto}
input[type=time]{font-size:20px;font-weight:700;width:7.8em;font-variant-numeric:tabular-nums;cursor:text}
.ic{display:inline-block;width:20px;height:20px;border-radius:5px;text-align:center;font-size:12px;font-weight:700;line-height:20px;vertical-align:-3px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
#map{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
svg{flex:none}
.ib svg{width:20px;height:20px;display:block}
#shp button{flex-direction:column;gap:2px;padding:6px 4px;min-height:64px;white-space:nowrap}
#shp svg{width:26px;height:30px;display:block}
.nm{font-size:17px;font-weight:700;fill:var(--ink)}
.nm.sub{font-size:15px}
#info{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--band);border-top:1px solid var(--rule);padding:8px 14px;z-index:5}
#info .wrap{min-height:30px}
#note{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
#note:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mute)}
.ln{margin-bottom:4px}
.mute{color:var(--mute)}
.hide{display:none!important}
.sw{width:32px;height:32px;min-height:0;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
#lcs input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule)}
#sb{overflow:auto;padding:4px 14px 16px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px;border-bottom:1px solid var(--rule);text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
th{font-weight:400;color:var(--mute);font-size:12px}
tr.past{opacity:.4}tr.now{background:var(--band);font-weight:700}tr.next{box-shadow:inset 3px 0 0 var(--lc)}
.hr{width:2.3em;font-weight:700;font-size:22px}
.m{display:inline-flex;flex-direction:column;align-items:center;margin:0 12px 10px 0;line-height:1.15}.m b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.m small{font-size:11px;color:var(--mute);white-space:nowrap}
h3{margin:14px 0 4px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}


:root{--hd:#16427f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#0f2a4f}}
:root[data-theme="dark"]{--hd:#0f2a4f}
header{background:var(--hd);color:#fff;border-bottom:0}
header h1{color:#fff}
header button,header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
header .seg button{color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
#rt{overflow:auto;padding:0 14px 100px;cursor:grab;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}

#ov{padding-bottom:90px}
table.ro{border-collapse:separate;border-spacing:0;width:max-content}
.ro td{padding:2px;border:0;vertical-align:middle}
.ro td.lf{padding:1px 4px 1px 0}
.lb{display:flex;align-items:center;gap:6px;width:150px;min-height:42px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:3px 8px;cursor:pointer}
.fm{min-width:1.8em;text-align:center;font-size:18px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.fm.none{color:var(--line);font-weight:400}
.un{display:inline-block;background:var(--hd);color:#fff;border-radius:99px;padding:0 8px;font-size:13px;font-weight:700}
.io{font-size:10px;color:var(--mute);line-height:1.3}
.c{flex-direction:column;justify-content:center;gap:0;width:72px;min-height:40px;border:0;border-radius:5px;padding:2px 3px;line-height:1.2;font-variant-numeric:tabular-nums}
.c b{font-size:15px}.c small{font-size:10px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp{padding:8px 0 10px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.po{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--rule)}
.po b{font-size:18px;min-width:2.2em}.po span{flex:1;min-width:0}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:15px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav button{flex-direction:column;gap:2px;border:0;border-radius:0;background:transparent;min-height:56px;font-size:12px;color:var(--mute);position:relative}
#bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bnav button.on{color:var(--acc);font-weight:700}
#bnav button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
header .pri{background:#fff;color:var(--hd);border-color:#fff}
#ctl.fold #mdate,#ctl.fold .r2{display:none}
#ctl.fold #tin{flex:1}
#ctl.fold #fold svg{transform:rotate(180deg)}
#sbody{padding:0 14px 100px}
.stt{width:100%;border-collapse:collapse}.stt tr[data-t]{cursor:pointer}.stt tr[data-t]:hover td{background:var(--band)}
.stt th{font-size:11px;color:var(--mute);text-align:left;font-weight:400;padding:4px 6px}
.stt td{padding:5px 6px;white-space:nowrap;vertical-align:top}.stt tr.hh td{border-top:2px solid var(--rule)}
.stt td b{font-size:19px;font-variant-numeric:tabular-nums}.stt small{display:block;font-size:10px;color:var(--mute)}
.ab{display:inline-block;min-width:2.4em;padding:0 5px;height:20px;border-radius:5px;text-align:center;font-size:11px;font-weight:700;line-height:20px;vertical-align:-3px;margin-right:4px;white-space:nowrap}
#dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
#dbar button{min-height:36px;min-width:36px;font-size:18px}#dbar #dtoday{font-size:14px}
#dinfo{flex-basis:100%;font-size:13px;color:#fff;opacity:.92}
#mdia{flex:1;min-width:0;color:#fff;font-size:13px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pop{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#pop.hide{display:none}
.pc{background:var(--panel);color:var(--ink);border-radius:12px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.pc h3{margin:0;font-size:18px}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.fl input{font-size:16px}
.fmw{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.pv{font-size:10px;color:var(--mute);text-decoration:line-through;line-height:1.1}
.rp{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--band);color:var(--acc)}
#ph{margin-top:10px}#popen{margin-top:2px}
.wn{display:inline-block;margin-left:4px;width:15px;height:15px;border-radius:50%;background:#e8a317;color:#fff;font-size:11px;font-weight:700;line-height:15px;text-align:center;vertical-align:1px}
.wnote{margin:0 0 8px;padding:6px 10px;border-left:4px solid #e8a317;background:var(--band);font-size:12px}
.gh td{padding:14px 0 4px}
.gb{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 4px;border:0;background:transparent;font-size:14px;font-weight:700;position:sticky;left:0}
.gb i{width:12px;height:12px;border-radius:3px;display:inline-block}.gb small{color:var(--mute);font-weight:400;font-size:12px}
.cl{margin:6px 0;padding-left:18px;font-size:13px}.cerr{color:#e0524a}.cwarn{color:#c98a00}
.cx{margin:8px 0;padding:8px;background:var(--band);border-radius:6px;font-size:11px;line-height:1.5;overflow:auto;white-space:pre}
.cx2{margin:6px 0;font-size:12px;line-height:1.7;color:var(--mute)}
details{margin:8px 0}summary{cursor:pointer;font-weight:700;font-size:14px}
</style>
</head>
<body>
<header id="hd" class="hide">
  <div class="wrap">
    <div class="top">
      <h1 id="ttl">運用・列車位置</h1>
      <span class="acts"><button class="ib" id="gear" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></g></svg></button><button class="ib" id="thm" aria-label="ライト/ダークを切り替え" title="ライト/ダーク"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button><button id="lst" title="路線を選ぶ">路線</button><button id="out" title="ログアウト">ログアウト</button></span>
    </div>
    <div id="dbar" class="hide"><button id="dprev" aria-label="前の日">‹</button><input id="dsel" type="date" aria-label="日付"><button id="dnext" aria-label="次の日">›</button><button id="dtoday">今日</button><select id="ddia" class="hide" aria-label="ダイヤ"></select><span id="dinfo"></span></div>
    <div id="ctl" class="hide">
      <div class="row"><input id="mdate" type="date" aria-label="日付" style="flex:1;min-width:0"><input id="tin" type="time" step="1" aria-label="時刻(直接入力)" style="flex:1;min-width:0"><button id="fold" class="ib" aria-expanded="true" title="折りたたむ" aria-label="操作パネルの折りたたみ"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="row r2"><button id="now">いま</button><span id="mdia"></span></div>
    </div>
  </div>
</header>
<div id="auth" class="wrap" style="padding:48px 14px"><h1>ログイン</h1>
<form id="lf" style="display:flex;flex-direction:column;gap:10px;margin-top:14px"><input id="em" type="email" autocomplete="username" required placeholder="メールアドレス"><input id="pw" type="password" autocomplete="current-password" required placeholder="パスワード"><button class="pri" type="submit">ログイン</button><div id="aerr" class="mute" role="alert"></div></form></div>
<div id="drop" class="hide"><h2>路線を選んでください</h2><div id="lines" class="tiles"></div><div id="lmsg" class="mute" style="margin-top:12px"></div></div>
<section id="rs" class="hide"><div class="bar"><span id="rmsg" class="mute">運用の行をタップで運用の一覧、列車のマスをタップで時刻</span></div><div id="rt"></div></section>
<section id="sv" class="hide"><div class="bar"><button id="sprev" aria-label="前の駅" style="font-size:20px;min-width:44px">‹</button><select id="sstn" aria-label="駅" style="flex:1;min-width:0"></select><button id="snext" aria-label="次の駅" style="font-size:20px;min-width:44px">›</button></div>
<div class="bar" style="padding-top:0"><div class="seg" id="sdirs" style="width:150px"><button data-sd="0" class="on">下り</button><button data-sd="1">上り</button></div><span id="smeta" class="mute"></span></div><div id="sbody"></div></section>
<section id="ov" class="hide"></section>
<main class="hide" id="mn"><div class="wrap"><svg id="map" role="img" aria-label="路線図"><g id="base"></g><g id="stp" style="pointer-events:none"></g><g id="trains"></g></svg></div></main>
<div id="sheet" class="hide"><div id="sh"></div><div id="sb"></div></div>
<div id="pop" class="hide" role="dialog" aria-modal="true" aria-labelledby="ptt"><div class="pc">
  <h3 id="ptt">編成を投稿</h3><div id="pw" class="mute"></div>
  <label class="fl">編成<input id="pf" type="text" maxlength="20" placeholder="例 06" autocomplete="off"></label>
  <label class="opt"><input id="pc" type="checkbox">差替(直前の編成から差し替えた)</label>
  <label class="fl">備考(任意)<input id="pr" type="text" maxlength="100" placeholder="例 側面:3段帯" autocomplete="off"></label>
  <div id="pm" class="mute" role="status"></div>
  <div class="row" style="justify-content:flex-end"><button id="pcx">キャンセル</button><button id="pb" class="pri">投稿</button></div>
</div></div>
<nav id="bnav" class="hide" aria-label="表示の切り替え"><button id="nr" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>運用一覧</button><button id="nm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-10a6 6 0 1 1 12 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>在線位置</button><button id="ns"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>駅時刻表</button></nav>
<div id="info" class="hide"><div class="wrap"><div id="inf"></div><div id="note">時刻表に基づく計算上の位置です。実際の運行とは異なる場合があります</div></div></div>
<script>
const $=s=>document.querySelector(s);
let LX=[170,330];const X=l=>LX[l]??LX[LX.length-1], Y=r=>60+r*176, BC=["#d98c00","#2f8fd0","#a14fb8"];
let M=null,T=0,live=true,selIds=new Set(),hidden=new Set(),hideTT=new Set(),cur=[],lastHtml='';

function parseOud(t){const root={},stack=[root];for(const l of t.split('\n')){const c=stack[stack.length-1];if(l==='.'){if(stack.length>1)stack.pop();continue}const q=l.indexOf('=');if(q<0){if(l.endsWith('.')){const o={};(c[l.slice(0,-1)]??=[]).push(o);stack.push(o)}continue}c[l.slice(0,q)]=l.slice(q+1)}return root}
const tm=s=>{if(!s)return null;s=s.trim();if(!/^\d{3,6}$/.test(s))return null;const L=s.length;if(L<=4)return +s.slice(0,L-2)*3600+ +s.slice(-2)*60;return +s.slice(0,L-4)*3600+ +s.slice(-4,-2)*60+ +s.slice(-2)};
const fmt=(t,s)=>{t=Math.floor(t)%86400;return String(t/3600|0).padStart(2,'0')+':'+String(t%3600/60|0).padStart(2,'0')+(s?':'+String(t%60).padStart(2,'0'):'')};
// OuDiaの色は BBGGRR 順
const col=c=>{c=(c||'00000000').slice(-6);if(!/^[0-9a-fA-F]{6}$/.test(c))c='000000';const h='#'+c.slice(4,6)+c.slice(2,4)+c.slice(0,2);return h==='#000000'?'var(--ink)':h};

function setup(root,name){
  const R=root.Rosen[0];
  const st=R.Eki.map((e,i)=>({name:e.Ekimei,major:e.Ekikibo==='Ekikibo_Syuyou',core:e.BrunchCoreEkiIndex!=null?+e.BrunchCoreEkiIndex:null,tracks:e.EkiTrack2Cont?.[0]?.EkiTrack2||[]}));
  // --- 駅の接続関係を作る ---
  // BrunchCoreEkiIndex を持つ駅は、指された駅と同じ駅(分岐駅)。駅リストの隣同士は基本的につながるが、
  // 分岐駅とその相手の間にある側の隣接だけは、実際の線路ではないので外す
  const n=st.length,par=st.map((_,i)=>i),find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const cut=new Set();
  st.forEach((e,i)=>{if(e.core==null||e.core<0||e.core>=n)return;const a=find(i),b=find(e.core);if(a<b)par[b]=a;else par[a]=b;cut.add(i<e.core?i+'_'+(i+1):(i-1)+'_'+i)});
  const cn=i=>find(i),adj=new Map();
  st.forEach((_,i)=>{if(cn(i)===i)adj.set(i,new Set())});
  const fwd=new Set();
  for(let i=0;i<n-1;i++){if(cut.has(i+'_'+(i+1)))continue;const u=cn(i),v=cn(i+1);if(u!==v){adj.get(u).add(v);adj.get(v).add(u);fwd.add(u+'>'+v)}}
  // fwd: 下り列車がu→vへ進む向き。本線は下り向きに一方通行で最も長くたどれる経路にする
  const dn=(u,x)=>fwd.has(u+'>'+x),pos=[],lanes=[],conn=[],node={};let rows=0,maxLane=1;
  const longest=(u,up,vis=new Set([u]))=>{let best=[];for(const x of adj.get(u)){if(node[x]||vis.has(x)||!(up?dn(x,u):dn(u,x)))continue;vis.add(x);const p=longest(x,up,vis);if(p.length>best.length)best=p}return [u,...best]};
  for(;;){
    let main=[];for(const u of adj.keys())if(!node[u]){const p=longest(u,false);if(p.length>main.length)main=p}
    if(!main.length)break;
    const comp=[],cs=[];lanes.length=0;
    main.forEach((u,i)=>{node[u]={lane:0,row:i};comp.push(u)});

    while(todo.length){const v=todo.shift(),pv=node[v];
      for(const w of adj.get(v)){if(node[w])continue;
        // 下り列車が分岐線から駅へ入ってくる(合流)なら分岐線は駅の上側、駅から出ていくなら下側に伸ばす
        const up=dn(w,v)&&!dn(v,w),P=longest(w,up),r0=pv.row,len=P.length,lo=up?r0-len:r0+1,hi=up?r0-1:r0+len;

    const types=(R.Ressyasyubetsu||[]).map(t=>({name:t.Syubetsumei,ini:[...(t.Ryakusyou||t.Syubetsumei||'?')][0],ab:t.Ryakusyou||[...(t.Syubetsumei||'?')][0],col:col(t.DiagramSenColor||t.JikokuhyouMojiColor)}));
  M={st,pos,conn,rows,maxLane,types,adj,cn,dias:(R.Dia||[]).map(d=>({name:d.DiaName||'ダイヤ',d,trains:null})),name:name||R.Rosenmei||'',kiten:(()=>{const k=tm(R.KitenJikoku);return k>0?k:14400})()};
  // --- 駅名・停車種別の文字幅から各レーンの位置と全体の幅を決める(駅名と列車アイコンが重ならないように) ---
  // 本線(レーン0)の文字は線の左側、分岐レーンの文字は線の右側。列車アイコンは線から26pxの位置で、
  // 同じ駅に列車が重なって寄る場合は34pxさらに外側(合計で約78pxまで)に出る
  M.dias.forEach(d=>{if(!d.trains)d.trains=build(d);d.stops=stopMap(d)});
  loadCfg(); // 路線ごとの詳細設定(<路線名>.config.json)
  const wl=[];
  st.forEach((e,i)=>{const p=pos[i];if(p.copy)return;let nc=0;for(const d of M.dias)nc=Math.max(nc,(d.stops.get(pk(i))||new Set()).size);
    const fs=p.lane?15:17,nw=[...e.name].reduce((a,c)=>a+(c.charCodeAt(0)>255?1:.58)*fs,0);wl[p.lane]=Math.max(wl[p.lane]||0,nw,nc*19)});
  LX=[12+(wl[0]||0)+6+78];LX[1]=LX[0]+162;

  // 本線(レーン0)の線
  const l0=Object.values(node).filter(p=>p.lane===0).map(p=>p.row);
  if(l0.length){const ms=st.map((_,i)=>i).filter(i=>!pos[i].copy&&pos[i].lane===0).sort((a,b)=>pos[a].row-pos[b].row);
    if(!M.cfg||!M.cfg.segments.length||ms.length<2)h+=`<line x1="${X(0)}" y1="${Y(Math.min(...l0))-40}" x2="${X(0)}" y2="${Y(Math.max(...l0))}" stroke="var(--lc)" stroke-width="9" stroke-linecap="round"/>`;

  // 分岐線は駅と駅の間でカーブを描いて本線から分かれる。分岐駅までの区間は、分岐先の線を本線の上(手前)に重ねて描く
  for(const c of conn){const f=c.from,R=26,x0=X(f.lane),x1=X(c.lane),mx=(x0+x1)/2,sg=Math.sign(x1-x0)||1;let d,hy;
    if(!c.up){const yA=Y(f.row)+56;hy=yA+R;d=`M${x0} ${Y(f.row)}V${yA}Q${x0} ${hy} ${x0+sg*R} ${hy}H${x1-sg*R}Q${x1} ${hy} ${x1} ${yA+2*R}V${Y(c.bot)}`}

    h+=`<g data-st="${i}" style="cursor:pointer"><rect x="${p.lane?x-16:0}" y="${y-26}" width="${p.lane?W-x+16:x+16}" height="52" fill="transparent"/><circle cx="${x}" cy="${y}" r="${s.major?9:7.5}" fill="var(--panel)" stroke="var(--stn)" stroke-width="5"/>`;

  const H=Y(rows)+10;$('#map').setAttribute('viewBox',`0 0 ${W} ${H}`);$('#map').style.maxWidth=W+'px';$('#map').style.minWidth=(maxLane>1||W>520)?W+'px':'';$('#base').innerHTML=h;
  // UI
  $('#ttl').textContent=M.name||'列車位置表示';
  hidden.clear();hideTT.clear();selIds=new Set();cfgTypes();

function build(d){
  const n=M.st.length,out=[];
  for(const [sec,dir] of [['Kudari',0],['Nobori',1]])for(const r of (d.d[sec]?.[0]?.Ressya||[])){
    const route=[];
    (r.EkiJikoku||'').split(',').forEach((e,j)=>{
      if(!e)return;const m=e.match(/^(\d)(?:;([^$]*))?/);if(!m)return;const ty=+m[1];if(ty!==1&&ty!==2)return;
      // 上り列車の時刻は駅順が逆(末尾が最初の駅)で記録されている
      const s=dir?n-1-j:j;let a=null,dd=null;
      if(m[2]!=null){const p=m[2].split('/');a=tm(p[0]);dd=tm(p[1]);if(a==null)a=dd;if(dd==null)dd=a}
      route.push({s,a,d:dd,ps:ty===2,tk:(e.match(/\$(\d+)/)||[])[1]});
    });
    const si=[];route.forEach((x,i)=>{if(x.a!=null)si.push(i)});
    const stp=si.filter(i=>!route[i].ps);if(stp.length<2)continue;
    let off=route[si[0]].a<M.kiten?86400:0,prev=-1; // 起点時刻より前の時刻は翌日(24時以降)として扱う
    for(const i of si){const x=route[i];let a=x.a+off;if(a<prev){off+=86400;a+=86400}let dd=x.d+off;if(dd<a){off+=86400;dd+=86400}x.a=a;x.d=dd;prev=dd}
    out.push({dir,ty:+r.Syubetsu||0,name:[r.Ressyabangou,r.Ressyamei].filter(Boolean).join(' '),route,si,fs:stp[0],ls:stp[stp.length-1],t0:route[si[0]].a,t1:route[si[si.length-1]].d,id:out.length,bikou:r.Bikou||'',opk:Object.fromEntries(Object.entries(r).filter(([k])=>/^Operation\d+[AB]$/.test(k)))});
  }
  linkOps(out);return out;
}

// 最小費用の割り当て(ハンガリー法)。C は正方行列で、行iに割り当てる列を配列で返す
function assign(C){
  const N=C.length,u=new Float64Array(N+1),v=new Float64Array(N+1),p=new Int32Array(N+1),way=new Int32Array(N+1);
  for(let i=1;i<=N;i++){p[0]=i;let j0=0;const minv=new Float64Array(N+1).fill(Infinity),used=new Uint8Array(N+1);
    do{used[j0]=1;const i0=p[j0];let d=Infinity,j1=0;
      for(let j=1;j<=N;j++)if(!used[j]){const c=C[i0-1][j-1]-u[i0]-v[j];if(c<minv[j]){minv[j]=c;way[j]=j0}if(minv[j]<d){d=minv[j];j1=j}}
      for(let j=0;j<=N;j++){if(used[j]){u[p[j]]+=d;v[j]-=d}else minv[j]-=d}
      j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const r=new Int32Array(N);for(let j=1;j<=N;j++)r[p[j]-1]=j-1;return r}
// 運用の連なり。OperationNB=始発側 / OperationNA=終着側。値は「,」区切りで
//   5/…                      前後の列車と接続
//   3/時刻$連携コード/運用名    出区(始発側)・入区(終着側)。同じ連携コードの入区と出区は、車庫を経由してつながる
//   0/種類$開始/終了$番線       駅作業(入換など)。作業のあと、車両は指定の番線に移る
// つなぎ方: ①連携コードの一致 ②同じ駅ごとの最適な割り当て(駅作業の時刻と番線も考慮)
function linkOps(out){
  const K=M.kiten,sh=v=>v!=null&&v<K?v+86400:v; // 起点時刻より前は翌日
  const pv=v=>{const o={conn:false,depot:null,works:[]};
    for(const it of v.split(',')){
      if(it.startsWith('5/'))o.conn=true;
      else if(it.startsWith('3/')){const m=it.match(/^3\/([^$]*)\$([^/]*)(?:\/(.*))?$/);if(m)o.depot={t:sh(tm(m[1])),code:m[2],name:m[3]||''}}
      else if(it.startsWith('0/')){const m=it.match(/^0\/(\d*)\$([^/]*)\/([^$]*)\$(\d*)$/);if(m)o.works.push({s:sh(tm(m[2])),e:sh(tm(m[3])),tk:m[4]||null})}}
    return o};
  let any=false;
  for(const t of out){t.A={conn:false,depot:null,works:[]};t.B={conn:false,depot:null,works:[]};t.op=null;t.pv=t.nx=null;
    for(const k in t.opk){any=true;t[k.slice(-1)]=pv(t.opk[k])}
    const a=t.route[t.fs],b=t.route[t.ls];t.dep=a.d;t.arr=b.a;t.tkS=a.tk;
    const w=t.A.works.filter(x=>x.tk!=null);t.tkEff=w.length?w[w.length-1].tk:b.tk;              // 駅作業のあとの番線
    t.workEnd=Math.max(t.arr,...t.A.works.map(x=>x.e??0));
    t.workStart=t.B.works.length?Math.min(...t.B.works.map(x=>x.s??Infinity)):Infinity}
  out.ops=[];if(!any)return;
  // ① 入出区連携コード
  const As=new Map(),Bs=new Map(),add=(m,c,t)=>{if(!m.has(c))m.set(c,[]);m.get(c).push(t)};
  for(const t of out){if(t.A.depot&&t.A.depot.code)add(As,t.A.depot.code,t);if(t.B.depot&&t.B.depot.code)add(Bs,t.B.depot.code,t)}
  for(const [c,al] of As){const bl=(Bs.get(c)||[]).sort((p,q)=>p.dep-q.dep),used=new Set();
    for(const a of al.sort((p,q)=>p.arr-q.arr)){const b=bl.find(x=>!used.has(x)&&x.dep>=a.arr);if(b){used.add(b);a.nx=b;b.pv=a}}}
  // ② 同じ駅ごとに、到着列車と出発列車の組み合わせ全体が最適になるように割り当てる
  //    (時刻が合う・駅作業が終わっている・同じ番線(駅作業のあとの番線)を優先し、待ち時間が短いほど良い)
  const arr=new Map(),dep=new Map();
  for(const t of out){if(t.A.conn&&!t.nx)add(arr,t.route[t.ls].s,t);if(t.B.conn&&!t.pv)add(dep,t.route[t.fs].s,t)}
  for(const [s,A] of arr){const D=dep.get(s);if(!D)continue;
    const n=A.length,m=D.length,N=n+m,INF=1e9,C=Array.from({length:N},()=>new Array(N).fill(0));
    for(let a=0;a<n;a++){const x=A[a];
      for(let b=0;b<m;b++){const y=D[b],ok=x.workEnd<=y.dep&&!(y.B.works.length&&y.workStart<x.arr);
        C[a][b]=!ok?INF:((y.B.works.length||x.tkEff===y.tkS)?0:5000)+Math.min((y.dep-x.arr)/60,1000)}
      for(let b=0;b<n;b++)C[a][m+b]=a===b?20000:INF}               // 相手が見つからない到着列車
    for(let a=0;a<m;a++)for(let b=0;b<m;b++)C[n+a][b]=a===b?20000:INF;  // 相手が見つからない出発列車
    const as=assign(C);
    for(let a=0;a<n;a++){const b=as[a];if(b<m&&C[a][b]<INF){A[a].nx=D[b];D[b].pv=A[a]}}}
  // 連なりを運用にまとめる(運用名は最初の列車の出区に書かれた名前)。つながりが不完全なものには警告をつける
  let un=0;
  for(const t of out){if(t.pv)continue;const tr=[t];while(tr[tr.length-1].nx)tr.push(tr[tr.length-1].nx);
    const f=tr[0],l=tr[tr.length-1],nm=f.B.depot&&f.B.depot.name||'',warn=[];
    if(f.B.conn)warn.push('最初の列車に、前の列車が見つかりません');else if(f.B.depot&&f.B.depot.code)warn.push(`連携コード${f.B.depot.code}の入区が見つかりません`);else if(!f.B.depot)warn.push('出区の記述がありません');
    if(l.A.conn)warn.push('最後の列車が次の列車に接続のままです(つながる列車が見つかりません)');else if(l.A.depot&&l.A.depot.code)warn.push(`連携コード${l.A.depot.code}の出区が見つかりません`);else if(!l.A.depot)warn.push('入区の記述がありません');
    out.ops.push({name:nm||'運用'+(++un),named:!!nm,trains:tr,warn})}
  out.ops.sort((a,b)=>(a.named?0:1)-(b.named?0:1)||a.name.localeCompare(b.name,'ja',{numeric:true}));
  const cnt=new Map();for(const o of out.ops)cnt.set(o.name,(cnt.get(o.name)||0)+1);
  const kk=new Map();
  for(const o of out.ops){const f=o.trains[0];o.key=cnt.get(o.name)>1?`${o.name}(${M.st[f.route[f.fs].s].name})`:o.name;kk.set(o.key,(kk.get(o.key)||0)+1)}
  for(const o of out.ops)if(kk.get(o.key)>1){const f=o.trains[0],h=f.dep;o.key=`${o.key.slice(0,-1)} ${String(Math.floor(h/3600)%24).padStart(2,'0')}:${String(Math.floor(h%3600/60)).padStart(2,'0')})`} // 運用名の重複(同じ運用名・同じ始発駅)は時刻も付けて区別
  out.ops.forEach((o,i)=>{o.i=i;o.trains.forEach((t,k)=>{t.op=o;t.oi=k})});
}


function useDia(i,first){
  const d=M.dias[i];M.cur=i;if(!d.trains)d.trains=build(d);cur=d.trains;selIds=new Set();
  const lo=Math.floor(Math.min(...cur.map(t=>t.t0))/900)*900,hi=Math.ceil(Math.max(...cur.map(t=>t.t1))/900)*900;
  M.lo=isFinite(lo)?lo:0;M.hi=isFinite(hi)?hi:86400;
    if(first||T<M.lo||T>M.hi){const now=new Date();const n=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();T=(n>=M.lo&&n<=M.hi)?n:M.lo}
  drawStops();draw();
}

const P=s=>{const p=M.pos[s];return{x:X(p.lane),y:Y(p.row)}};
// 分岐側の駅(コピー)は本線の駅と同じ位置
const pp=P;
const poly=nodes=>nodes.map(z=>pp(z.s));
// 本線と分岐線をまたぐ区間は、縦方向の距離だけ進み、区間の半分(2/4)を過ぎたところで分岐先の線路へワープする
function along(pts,f,q){const ls=[];let L=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=a.x!==b.x?Math.abs(b.y-a.y):Math.hypot(b.x-a.x,b.y-a.y);ls.push(l);L+=l}
  if(!L)return q<3?pts[0]:pts[pts.length-1];let t=f*L;
  for(let i=0;i<ls.length;i++){if(ls[i]>0&&t<=ls[i]){const k=t/ls[i],a=pts[i],b=pts[i+1];return{x:a.x!==b.x?(k<.5?a.x:b.x):a.x,y:a.y+(b.y-a.y)*k}}t-=ls[i]}
  return pts[pts.length-1]}
// 駅間を4分割し、区間ごとに段階的に進む。出発直後と到着直前は、その駅に別の番線の列車がいる場合だけ番線側へ寄る
function where(tr,t){
  if(t<tr.t0){ // 前の列車と駅でつながっているなら、前の列車が終着に着いてから出発まで、始発駅で次の列車として待機する(入出庫の連携は車庫に入るので表示しない)
    const p=tr.pv;if(p&&p.nx===tr&&!(p.A.depot&&p.A.depot.code)&&t>p.t1){const x=tr.route[tr.si[0]];return{p:pp(x.s),at:x.s,tk:x.tk,k:0,sp:pp(x.s),stk:x.tk,ss:x.s,ta:p.t1,wait:true}}
    return null}
  if(t>tr.t1)return null;const R=tr.route,si=tr.si;
  for(let k=0;k<si.length;k++){const x=R[si[k]];
    if(t>=x.a&&t<=x.d){if(!x.ps)return{p:pp(x.s),at:x.s,tk:x.tk,k,sp:pp(x.s),stk:x.tk,ss:x.s,ta:x.a};
      const nx=R[si[k+1]];return{p:pp(x.s),from:x.s,next:nx?nx.s:x.s,k,q:1,sp:null}}
    if(k+1<si.length){const y=R[si[k+1]];
      if(t>x.d&&t<y.a){const q=Math.min(3,4*(t-x.d)/(y.a-x.d)|0);
        return{p:along(poly(R.slice(si[k],si[k+1]+1)),(q+.5)/4,q),from:x.s,next:y.s,k,q,sp:q===0&&!x.ps?pp(x.s):q===3&&!y.ps?pp(y.s):null,stk:q===0?x.tk:y.tk,ss:q===0?x.s:y.s,ta:q===0?x.a:y.a}}}}

// 日本の祝日(2007〜2099年)。振替休日と国民の休日を含む
const jpHol=(()=>{
  const dow=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();
  const nthMon=(y,m,n)=>{const f=dow(y,m,1);return 1+(8-f)%7+(n-1)*7};          // m月の第n月曜日
  const eq=(y,k)=>Math.floor(k+0.242194*(y-1980)-Math.floor((y-1980)/4));        // 春分・秋分(1980〜2099年)
  const base=(y,m,d)=>{ // 振替休日を除く祝日か
    if(y<2007||y>2099)return false;
    if(m===1)return d===1||d===nthMon(y,1,2);
    if(m===2)return d===11||(d===23&&y>=2020);
    if(m===3)return d===eq(y,20.8431);
    if(m===4)return d===29;
    if(m===5)return d===3||d===4||d===5||(y===2019&&d===1);
    if(m===7){if(y===2020)return d===23||d===24;if(y===2021)return d===22||d===23;return d===nthMon(y,7,3)}
    if(m===8){if(y===2020)return d===10;if(y===2021)return d===8;return y>=2016&&d===11}
    if(m===9)return d===nthMon(y,9,3)||d===eq(y,23.2488);
    if(m===10){if(y===2019&&d===22)return true;return y!==2020&&y!==2021&&d===nthMon(y,10,2)}
    if(m===11)return d===3||d===23;
    if(m===12)return d===23&&y<=2018;
    return false};
  const add=(y,m,d,n)=>{const t=new Date(Date.UTC(y,m-1,d+n));return[t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()]};
  return(y,m,d)=>{
    if(base(y,m,d))return true;
    if(dow(y,m,d)!==0){ // 振替休日: 直前の連続する祝日の先頭が日曜なら、その次の平日
      for(let k=1;k<=7;k++){const[a,b,c]=add(y,m,d,-k);if(!base(a,b,c))break;if(dow(a,b,c)===0)return true}
      // 国民の休日: 前日と翌日がどちらも祝日の平日
      const p=add(y,m,d,-1),n=add(y,m,d,1);if(base(...p)&&base(...n))return true}
    return false};
})();

function jsonLoose(t){ // コメントと末尾のカンマを取り除いて、ふつうの JSON にする
  let o='',i=0,q=false,pend=-1;const n=t.length;
  if(t[0]==='\ufeff')i=1;

    if(q){o+=c;if(c==='\\'){o+=t[i+1]||'';i+=2;continue}if(c==='"')q=false;i++;continue}
    if(c==='/'&&t[i+1]==='/'){while(i<n&&t[i]!=='\n')i++;continue}
    if(c==='/'&&t[i+1]==='*'){const e=t.indexOf('*/',i+2);i=e<0?n:e+2;continue}
    if(c==='"')q=true;
    if(c===',')pend=o.length;
    else if(!/\s/.test(c)){if(pend>=0&&(c==='}'||c===']'))o=o.slice(0,pend)+o.slice(pend+1);pend=-1}
    o+=c;i++}

function stFinds(nm){ // 駅名(同じ名前の駅が複数あるときは「名前#2」で2番目)。分岐で重複した駅は1つと数える
  const m=String(nm==null?'':nm).match(/^(.*?)(?:#(\d+))?$/),name=m[1].trim(),k=m[2]?+m[2]:1,seen=new Set(),list=[];
  for(let i=0;i<M.st.length;i++){if(M.st[i].name!==name)continue;const u=M.cn(i);if(seen.has(u))continue;seen.add(u);list.push(i)}
  return{i:list[k-1]==null?-1:list[k-1],n:list.length,name}}

  for(let h=0;h<q.length;h++){const u=q[h];if(u===b)break;for(const v of M.adj.get(u)||[])if(!prev.has(v)){prev.set(v,u);q.push(v)}}
  if(!prev.has(b))return null;const p=[];for(let x=b;x!==null;x=prev.get(x))p.push(x);return p.reverse()}
function tyFinds(k){if(/^#\d+$/.test(k)){const i=+k.slice(1);return M.types[i]?[i]:[]}
  let r=M.types.map((t,i)=>t.name===k?i:-1).filter(i=>i>=0);if(!r.length)r=M.types.map((t,i)=>t.ab===k?i:-1).filter(i=>i>=0);return r}
function readCfg(text){ // 検証して、使える設定だけを取り出す。JSONとして読めない場合だけ全体をエラーにする
  const res={cfg:null,errors:[],warns:[]},E=res.errors,W=res.warns;let j;
  try{j=JSON.parse(jsonLoose(text))}catch(e){E.push('JSONとして読めません: '+e.message);return res}
  if(!j||typeof j!=='object'||Array.isArray(j)){E.push('最上位は { } の形にしてください');return res}
  for(const k of Object.keys(j))if(!['segments','types','groups','operations'].includes(k))W.push(`不明な項目「${k}」は無視します`);
  const cfg={segments:[],types:{},groups:[],operations:[]},arr=k=>j[k]==null?[]:Array.isArray(j[k])?j[k]:(W.push(`${k} は [ ] の形にしてください`),[]);
  const okName=x=>typeof x==='string'&&x.trim()&&x.length<=60;
  arr('segments').slice(0,200).forEach((g,n)=>{const lb=`segments[${n+1}]`;
    if(!g||typeof g!=='object'){W.push(`${lb}: { } の形にしてください`);return}
    const a=stFinds(g.from),b=stFinds(g.to);

    for(const x of[a,b])if(x.n>1&&!/#/.test(String(x===a?g.from:g.to)))W.push(`${lb}: 「${x.name}」は同じ名前の駅が${x.n}つあります。最初の駅を使います(2番目は ${x.name}#2)`);
    const path=stPath(a.i,b.i);if(!path){W.push(`${lb}: 「${g.from}」と「${g.to}」は線路でつながっていません`);return}
    cfg.segments.push({name:String(g.name||''),color:g.color,nodes:new Set(path),edges:new Set(path.slice(1).map((v,k)=>ekey(path[k],v)))})});
  if(j.types!=null&&(typeof j.types!=='object'||Array.isArray(j.types)))W.push('types は { } の形にしてください');
  else for(const [k,v] of Object.entries(j.types||{})){const ids=tyFinds(k);
    if(!ids.length){W.push(`types: 種別「${k}」が見つかりません`);continue}
    if(!v||typeof v!=='object'){W.push(`types「${k}」は { } の形にしてください`);continue}
    const o={};if('map' in v)o.map=!!v.map;if('timetable' in v)o.timetable=!!v.timetable;
    if(v.color!=null){if(HEX.test(v.color))o.color=v.color;else W.push(`types「${k}」: color は #RRGGBB の形で指定してください`)}
    if(v.ab!=null){if(typeof v.ab==='string'&&v.ab.trim()&&v.ab.length<=4)o.ab=v.ab.trim();else W.push(`types「${k}」: ab は4文字までの文字にしてください`)}
    for(const i of ids)cfg.types[i]={...(cfg.types[i]||{}),...o}}
  arr('groups').slice(0,100).forEach((g,n)=>{const lb=`groups[${n+1}]`;
    if(!g||!okName(g.name)){W.push(`${lb}: name を書いてください`);return}
    let re=null;if(g.match!=null){try{if(String(g.match).length>100)throw 0;re=new RegExp(String(g.match))}catch(e){W.push(`${lb}「${g.name}」: match の正規表現が正しくありません`)}}
    if(g.ops!=null&&!Array.isArray(g.ops))W.push(`${lb}「${g.name}」: ops は [ ] の形にしてください`);
    const ops=Array.isArray(g.ops)?g.ops.map(String):[];if(!ops.length&&!re)W.push(`${lb}「${g.name}」: ops か match のどちらかが必要です`);
    let color=null;if(g.color!=null){if(HEX.test(g.color))color=g.color;else W.push(`${lb}「${g.name}」: color は #RRGGBB の形で指定してください`)}
    cfg.groups.push({name:g.name.trim(),ops:new Set(ops),re,color})});
  arr('operations').slice(0,200).forEach((o,n)=>{const lb=`operations[${n+1}]`;
    if(!o||!okName(o.name)){W.push(`${lb}: name を書いてください`);return}
    if(!Array.isArray(o.trains)||!o.trains.length){W.push(`${lb}「${o.name}」: trains に列車を書いてください`);return}
    cfg.operations.push({name:o.name.trim(),dia:o.dia?String(o.dia):'',group:o.group?String(o.group).trim():'',trains:o.trains.slice(0,500).map(String)})});
  res.cfg=cfg;return res}
function findTrain(ref,byNo,byDep,W,opName,dn){ // 列車番号、または「始発駅 発時刻」。時刻は 24 時以降(25:10 など)も書ける
  const s=ref.trim(),m=s.match(/^(.+?)\s+(\d{1,2}):(\d{2})(?::\d{2})?$/);let c;
  if(m){let sec=+m[2]*3600+ +m[3]*60;if(sec<M.kiten)sec+=86400;const mi=Math.floor(sec/60);
    c=byDep.get(m[1]+'|'+mi)||(byNo.get(m[1])||[]).filter(t=>Math.floor(t.dep/60)===mi)}
  else c=byNo.get(s)||[];
  if(c.length>1)W.add(`operations「${opName}」: 「${ref}」に当てはまる列車が${c.length}本あります。最初の1本を使います(時刻を付けて「列車番号 5:30」のように指定できます)`);
  return c[0]||null}
function detach(t){const o=t.op;if(o){const k=o.trains.indexOf(t);if(k>=0)o.trains.splice(k,1)}
  if(t.pv&&t.pv.nx===t)t.pv.nx=null;if(t.nx&&t.nx.pv===t)t.nx.pv=null;t.pv=t.nx=null;t.op=null}
function applyCfgOps(){ // 自作の運用を作り、すべての運用をグループに分ける(ダイヤごと)
  const cfg=M.cfg,W=new Set(M.cfgInfo.warns),made=new Set();
  const stn=t=>M.st[t.route[t.fs].s].name,hm=s=>`${Math.floor(s/3600)%24}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
  for(const d of M.dias){const out=d.trains;if(!out)continue;if(!out.ops)out.ops=[];
    const byNo=new Map(),byDep=new Map(),add=(m,k,t)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(t)};
    for(const t of out){if(t.name)add(byNo,t.name,t);add(byDep,stn(t)+'|'+Math.floor(t.dep/60),t)}
    const mine=[];
    cfg.operations.forEach((co,ci)=>{if(co.dia&&co.dia!==d.name)return;
      const trs=[],miss=[];for(const ref of co.trains){const t=findTrain(ref,byNo,byDep,W,co.name);t?trs.push(t):miss.push(ref)}
      if(!trs.length)return;made.add(ci);
      for(const ref of miss)W.add(`operations「${co.name}」(${d.name}): 列車「${ref}」が見つかりません`);
      const u=[...new Set(trs)].sort((a,b)=>a.dep-b.dep);for(const t of u)detach(t);
      const warn=[];
      for(let k=0;k<u.length-1;k++){const a=u[k],b=u[k+1];
        if(a.route[a.ls].s===b.route[b.fs].s&&a.arr<=b.dep){a.nx=b;b.pv=a}
        else warn.push(a.route[a.ls].s!==b.route[b.fs].s?`「${a.name||stn(a)+' '+hm(a.dep)}」の終着駅と「${b.name||stn(b)+' '+hm(b.dep)}」の始発駅が違います`:`「${a.name||stn(a)+' '+hm(a.dep)}」の到着より前に「${b.name||stn(b)+' '+hm(b.dep)}」が出発します`)}
      mine.push({name:co.name,named:true,trains:u,warn,custom:true,group:co.group})});
    out.ops=out.ops.filter(o=>o.trains.length);
    const used=new Set(out.ops.map(o=>o.key));
    for(const o of mine){let k=o.name,n=2;if(used.has(k))k=o.name+'(自作)';while(used.has(k))k=`${o.name}(自作${n++})`;used.add(k);o.key=k;out.ops.push(o)}
    out.ops.sort((a,b)=>(a.named?0:1)-(b.named?0:1)||a.name.localeCompare(b.name,'ja',{numeric:true}));
    for(const o of out.ops){if(!(o.custom&&o.group)){const g=cfg.groups.find(g=>g.ops.has(o.key)||g.ops.has(o.name)||(g.re&&(g.re.test(o.key)||g.re.test(o.name))));o.group=g?g.name:''}}
    out.ops.forEach((o,i)=>{o.i=i;o.trains.forEach((t,k)=>{t.op=o;t.oi=k})})}
  cfg.operations.forEach((co,ci)=>{if(!made.has(ci))W.add(`operations「${co.name}」: ${co.dia?`ダイヤ「${co.dia}」に`:'どのダイヤにも'}列車が見つからないため、作りませんでした`)});
  M.cfgInfo.warns=[...W]}
function loadCfg(){
  const p=pendingCfg;pendingCfg=null;gcol.clear();M.cfg=null;M.cfgInfo={status:'none',errors:[],warns:[],note:''};
  if(!p)return;
  if(p.text==null){if(p.err&&!/404/.test(p.err)){M.cfgInfo.status='unreadable';M.cfgInfo.note=p.err}return}
  const r=readCfg(p.text);M.cfgInfo.errors=r.errors;M.cfgInfo.warns=r.warns;
  if(!r.cfg){M.cfgInfo.status='error';return}
  M.cfg=r.cfg;M.cfgInfo.status='ok';
  for(const [i,o] of Object.entries(M.cfg.types)){if(o.color)M.types[i].col=o.color;if(o.ab){M.types[i].ab=o.ab;M.types[i].ini=[...o.ab][0]}}
  applyCfgOps()}
function cfgTypes(){if(!M.cfg)return;for(const [i,o] of Object.entries(M.cfg.types)){if(o.map===false)hidden.add(+i);if(o.timetable===false)hideTT.add(+i)}}
const cfgFile=()=>lineFile.replace(/\.oud2?$/i,'')+'.config.json';
function cfgStatus(){const I=M.cfgInfo||{status:'none'},c=M.cfg;
  if(I.status==='ok')return `読み込み済み(線の色 ${c.segments.length}区間、種別 ${Object.keys(c.types).length}、グループ ${c.groups.length}、自作の運用 ${c.operations.length})`+(I.warns.length?`。確認が必要な点が${I.warns.length}件あります`:'');
  if(I.status==='error')return 'エラーがあり、読み込めませんでした(oud の内容のまま表示しています)';
  if(I.status==='unreadable')return '設定ファイルを取得できませんでした';
  return '設定ファイルはありません(oud の内容のまま表示しています)'}

function renderCfg(){

  <details><summary>設定の書き方の例</summary><pre class="cx">${esc(CFG_EXAMPLE)}</pre></details>
